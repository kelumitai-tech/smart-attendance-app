<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCPPqnPEfVLkc7K29YPV7GDkIaC6tcHn4E",
        authDomain: "smart-attendance-tracker-5573b.firebaseapp.com",
        projectId: "smart-attendance-tracker-5573b",
        storageBucket: "smart-attendance-tracker-5573b.firebasestorage.app",
        messagingSenderId: "342955621552",
        appId: "1:342955621552:web:790e9b4fb8a4e8edec4f75",
        measurementId: "G-01LEWN7WHX"
    };

    // Initialize Firebase
    let auth, db;
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        } else {
            firebase.app();
        }
        auth = firebase.auth();
        db = firebase.firestore();
        console.log("✅ Firebase initialized successfully!");
    } catch (error) {
        console.error("❌ Firebase initialization error:", error);
        alert("Firebase initialization failed. Please check console for details.");
    }

    // Global app data
    const appData = {
        currentUser: null,
        userRole: null,
        currentAttendance: {},
        currentTeacher: null,
        editingItem: null
    };

    // Initialize the application
    window.onload = function() {
        setupEventListeners();
        setTodayDate();
        checkAuthState();
    };

    function setTodayDate() {
        const today = new Date();
        const formattedDate = today.toISOString().split('T')[0];
        
        // Set date for attendance
        document.getElementById('startDate').value = formattedDate;
        document.getElementById('viewDate').value = formattedDate;
        
        // Set month for reports
        const currentMonth = formattedDate.substring(0, 7);
        document.getElementById('reportMonth').value = currentMonth;
        
        // Display current date
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const displayDate = today.toLocaleDateString('en-US', options);
        document.getElementById('currentDateDisplay').textContent = displayDate;
        
        // Restrict date selection to weekdays only
        restrictDateSelection();
    }

    function restrictDateSelection() {
        const dateInputs = document.querySelectorAll('input[type="date"]');
        
        dateInputs.forEach(input => {
            input.addEventListener('change', function() {
                const selectedDate = new Date(this.value);
                const dayOfWeek = selectedDate.getDay();
                
                // Disable weekends (Saturday = 6, Sunday = 0)
                if (dayOfWeek === 0 || dayOfWeek === 6) {
                    alert('Attendance can only be marked on weekdays (Monday to Friday)');
                    this.value = ''; // Clear the selection
                }
            });
        });
    }

    function checkAuthState() {
        if (auth) {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    console.log("User logged in:", user.email);
                    getUserRole(user.uid).then(role => {
                        console.log("User role retrieved:", role);
                        appData.currentUser = user;
                        appData.userRole = role;
                        showApp(role);
                    }).catch(error => {
                        console.error("Error getting user role:", error);
                    });
                } else {
                    console.log("No user logged in");
                    document.getElementById('loginScreen').style.display = 'block';
                    document.getElementById('appContent').style.display = 'none';
                }
            });
        } else {
            console.error("Firebase auth not initialized");
            document.getElementById('loginError').textContent = 'Authentication system not available. Please refresh the page.';
            document.getElementById('loginError').style.display = 'block';
        }
    }

    async function getUserRole(uid) {
        try {
            console.log("Getting role for user:", uid);
            const doc = await db.collection('users').doc(uid).get();
            if (doc.exists) {
                const role = doc.data().role;
                console.log("Role found in Firestore:", role);
                return role;
            } else {
                console.log("No role found in Firestore, defaulting to subjectTeacher");
                return 'subjectTeacher';
            }
        } catch (error) {
            console.error("Error getting user role:", error);
            return 'subjectTeacher';
        }
    }

    function setupEventListeners() {
        // Authentication
        document.getElementById('loginBtn').addEventListener('click', doLogin);
        document.getElementById('googleBtn').addEventListener('click', googleLogin);
        document.getElementById('registerBtn').addEventListener('click', showRegistration);
        document.getElementById('logoutBtn').addEventListener('click', doLogout);
        
        // Navigation
        document.querySelectorAll('.nav-tab').forEach(btn => {
            btn.addEventListener('click', function() {
                showTab(this.getAttribute('data-tab'));
            });
        });
        
        // Students
        document.getElementById('addStudentBtn').addEventListener('click', addStudent);
        document.getElementById('studentFilter').addEventListener('keyup', filterStudents);
        document.getElementById('filterStudentClass').addEventListener('change', filterStudents);
        
        // Attendance
        document.getElementById('loadAttendanceBtn').addEventListener('click', loadAttendance);
        document.getElementById('markAllBtn').addEventListener('click', markAllPresent);
        document.getElementById('saveAttendanceBtn').addEventListener('click', saveAttendance);
        document.getElementById('clearAllBtn').addEventListener('click', markAllAbsent);
        
        // Reports
        document.getElementById('generateReportBtn').addEventListener('click', generateReport);
        document.getElementById('generatePdfBtn').addEventListener('click', generatePdfReport);
        
        // Principal-only features
        document.getElementById('addTeacherBtn').addEventListener('click', addTeacher);
        document.getElementById('addSubjectBtn').addEventListener('click', addSubject);
        document.getElementById('addClassBtn').addEventListener('click', addClass);
        document.getElementById('teacherFilter').addEventListener('keyup', filterTeachers);
        document.getElementById('subjectFilter').addEventListener('keyup', filterSubjects);
        document.getElementById('gradeFilter').addEventListener('keyup', filterGrades);
        document.getElementById('viewAttendanceBtn').addEventListener('click', viewAttendanceRecords);
    }

    function doLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const errorMsg = document.getElementById('loginError');
        
        if (!email || !password) {
            errorMsg.textContent = 'Please enter both email and password';
            errorMsg.style.display = 'block';
            return;
        }
        
        if (!auth) {
            errorMsg.textContent = 'Authentication system not available. Please refresh the page.';
            errorMsg.style.display = 'block';
            return;
        }
        
        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                console.log("Login successful for:", user.email);
                return getUserRole(user.uid);
            })
            .then((role) => {
                console.log("Role after login:", role);
                appData.userRole = role;
                showApp(role);
                errorMsg.style.display = 'none';
            })
            .catch((error) => {
                console.error("Login error:", error);
                errorMsg.textContent = 'Login failed: ' + error.message;
                errorMsg.style.display = 'block';
            });
    }

    function googleLogin() {
        if (!auth) {
            document.getElementById('loginError').textContent = 'Authentication system not available. Please refresh the page.';
            document.getElementById('loginError').style.display = 'block';
            return;
        }

        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider)
            .then((result) => {
                const user = result.user;
                return getUserRole(user.uid);
            })
            .then((role) => {
                if (!role) {
                    const selectedRole = document.getElementById('loginRole').value;
                    const user = auth.currentUser;
                    return db.collection('users').doc(user.uid).set({
                        email: user.email,
                        role: selectedRole,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(() => selectedRole);
                }
                return role;
            })
            .then((role) => {
                appData.userRole = role;
                showApp(role);
            })
            .catch((error) => {
                document.getElementById('loginError').textContent = 'Google login failed: ' + error.message;
                document.getElementById('loginError').style.display = 'block';
            });
    }

    function showRegistration() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const role = document.getElementById('loginRole').value;
        const errorMsg = document.getElementById('loginError');
        
        if (!email || !password) {
            errorMsg.textContent = 'Please enter both email and password';
            errorMsg.style.display = 'block';
            return;
        }
        
        if (password.length < 6) {
            errorMsg.textContent = 'Password should be at least 6 characters';
            errorMsg.style.display = 'block';
            return;
        }

        if (!auth) {
            errorMsg.textContent = 'Authentication system not available. Please refresh the page.';
            errorMsg.style.display = 'block';
            return;
        }

        auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                return db.collection('users').doc(user.uid).set({
                    email: email,
                    role: role,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            })
            .then(() => {
                appData.userRole = role;
                showApp(role);
                errorMsg.style.display = 'none';
            })
            .catch((error) => {
                errorMsg.textContent = 'Registration failed: ' + error.message;
                errorMsg.style.display = 'block';
            });
    }

    function showApp(role) {
        console.log("Showing app for role:", role);
        
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        
        // Set role badge text
        let roleText = '';
        if (role === 'principal') roleText = 'Principal';
        else if (role === 'classTeacher') roleText = 'Class Teacher';
        else roleText = 'Subject Teacher';
        document.getElementById('roleBadge').textContent = roleText;
        
        // Show/hide elements based on role
        updateRoleBasedVisibility(role);
        
        // Update navigation tabs visibility
        updateNavTabs(role);
        
        updateAll();
    }

    function updateRoleBasedVisibility(role) {
        console.log("Updating visibility for role:", role);
        
        // Hide all role-specific elements first
        document.querySelectorAll('.principal-only, .class-teacher-only, .subject-teacher-only').forEach(el => {
            el.style.display = 'none';
        });
        
        // Show elements based on role
        if (role === 'principal') {
            document.querySelectorAll('.principal-only').forEach(el => {
                el.style.display = 'block';
            });
        } else if (role === 'classTeacher') {
            document.querySelectorAll('.class-teacher-only').forEach(el => {
                el.style.display = 'block';
            });
        } else if (role === 'subjectTeacher') {
            document.querySelectorAll('.subject-teacher-only').forEach(el => {
                el.style.display = 'block';
            });
        }
        
        // Always show common elements
        document.querySelectorAll('.principal-only.class-teacher-only.subject-teacher-only').forEach(el => {
            el.style.display = 'block';
        });
    }

    function updateNavTabs(role) {
        console.log("Updating nav tabs for role:", role);
        const navTabs = document.querySelectorAll('.nav-tab');
        
        navTabs.forEach(tab => {
            const tabName = tab.getAttribute('data-tab');
            let showTab = false;
            
            if (role === 'principal') {
                showTab = true; // Principal sees all tabs
            } else if (role === 'classTeacher') {
                // Class Teacher sees: Attendance, Students, Reports, Grades, Subjects
                showTab = ['attendance', 'students', 'reports', 'grades', 'subjects'].includes(tabName);
            } else if (role === 'subjectTeacher') {
                // Subject Teacher sees: Attendance, Reports
                showTab = ['attendance', 'reports'].includes(tabName);
            }
            
            tab.style.display = showTab ? 'block' : 'none';
        });
        
        // Ensure at least one tab is active
        const activeTabs = document.querySelectorAll('.nav-tab.active');
        if (activeTabs.length === 0) {
            const firstVisibleTab = document.querySelector('.nav-tab[style="display: block"], .nav-tab:not([style*="display: none"])');
            if (firstVisibleTab) {
                showTab(firstVisibleTab.getAttribute('data-tab'));
            }
        }
    }

    function doLogout() {
        if (!auth) {
            console.error("Auth not available for logout");
            return;
        }
        
        auth.signOut().then(() => {
            appData.currentUser = null;
            appData.userRole = null;
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('appContent').style.display = 'none';
        }).catch(error => {
            console.error("Logout error:", error);
        });
    }

    function showTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
        
        const tabElement = document.getElementById(tabName);
        const navElement = document.querySelector(`[data-tab="${tabName}"]`);
        
        if (tabElement) tabElement.classList.add('active');
        if (navElement) navElement.classList.add('active');
        
        // Refresh data when switching tabs
        if (tabName === 'students') updateStudentsList();
        if (tabName === 'teachers') updateTeachersList();
        if (tabName === 'subjects') updateSubjectsList();
        if (tabName === 'grades') updateGradesList();
        if (tabName === 'dashboard') updateDashboard();
    }

    // Update selectors with data from Firestore
    function updateSelectors() {
        if (!db) {
            console.error("Firestore not initialized");
            return;
        }

        // Classes/Grades
        db.collection('grades').orderBy('grade').get()
            .then((querySnapshot) => {
                let classOptions = '<option value="">-- Select Class --</option>';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const fullClass = data.grade + ' - ' + data.class;
                    classOptions += `<option value="${fullClass}">${fullClass}</option>`;
                });
                
                document.getElementById('selectClass').innerHTML = classOptions;
                document.getElementById('studentGrade').innerHTML = classOptions;
                document.getElementById('reportClass').innerHTML = classOptions;
                document.getElementById('viewClass').innerHTML = classOptions;
                document.getElementById('filterStudentClass').innerHTML = '<option value="">All Classes</option>' + classOptions;
            })
            .catch((error) => {
                console.error("Error getting grades: ", error);
            });
        
        // Subjects
        db.collection('subjects').orderBy('name').get()
            .then((querySnapshot) => {
                let subjectOptions = '<option value="">-- Select Subject --</option>';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    subjectOptions += `<option value="${data.name}">${data.name}</option>`;
                });
                
                document.getElementById('selectSubject').innerHTML = subjectOptions;
                document.getElementById('teacherSubject').innerHTML = subjectOptions;
                document.getElementById('reportSubject').innerHTML = subjectOptions;
                document.getElementById('viewSubject').innerHTML = subjectOptions;
            })
            .catch((error) => {
                console.error("Error getting subjects: ", error);
            });
        
        // Teachers
        db.collection('teachers').orderBy('name').get()
            .then((querySnapshot) => {
                let teacherOptions = '<option value="">-- Select Teacher --</option>';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    teacherOptions += `<option value="${doc.id}">${data.name} (${data.subject})</option>`;
                });
                
                document.getElementById('selectTeacher').innerHTML = teacherOptions;
                document.getElementById('viewTeacher').innerHTML = teacherOptions;
            })
            .catch((error) => {
                console.error("Error getting teachers: ", error);
            });
    }

    // Update all data
    function updateAll() {
        updateSelectors();
        updateStudentsList();
        if (appData.userRole === 'principal') {
            updateTeachersList();
        }
        updateSubjectsList();
        updateGradesList();
        updateDashboard();
    }

    // Student Management
    function addStudent() {
        const studentId = document.getElementById('studentId').value.trim();
        const studentName = document.getElementById('studentName').value.trim();
        const studentGrade = document.getElementById('studentGrade').value;
        const studentGender = document.getElementById('studentGender').value;
        const successMsg = document.getElementById('studentSuccess');
        
        if (!studentId || !studentName || !studentGrade) {
            alert('Please fill all fields');
            return;
        }
        
        if (!db) {
            alert('Database not available');
            return;
        }
        
        db.collection('students').doc(studentId).set({
            id: studentId,
            name: studentName,
            grade: studentGrade,
            gender: studentGender,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => {
            document.getElementById('studentId').value = '';
            document.getElementById('studentName').value = '';
            successMsg.textContent = 'Student added successfully!';
            successMsg.style.display = 'block';
            updateStudentsList();
            setTimeout(() => successMsg.style.display = 'none', 3000);
        })
        .catch((error) => {
            alert('Error adding student: ' + error.message);
        });
    }

    function updateStudentsList() {
        const studentList = document.getElementById('studentList');
        studentList.innerHTML = '<div class="loading">Loading students...</div>';
        
        if (!db) {
            studentList.innerHTML = '<div class="error-msg">Database not available</div>';
            return;
        }
        
        db.collection('students').orderBy('grade').get()
            .then((querySnapshot) => {
                if (querySnapshot.empty) {
                    studentList.innerHTML = '<div class="info-box">No students found. Add some students to get started.</div>';
                    return;
                }
                
                let html = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `
                        <div class="student-item" id="student-${data.id}">
                            <div class="item-info">
                                <strong>${data.id}</strong> - ${data.name} (${data.grade}) - ${data.gender}
                            </div>
                            <div class="item-actions">
                                <button class="btn btn-warning btn-small" onclick="editStudent('${data.id}')">✏️ Edit</button>
                                <button class="btn btn-danger btn-small" onclick="deleteStudent('${data.id}')">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                });
                
                studentList.innerHTML = html;
            })
            .catch((error) => {
                studentList.innerHTML = '<div class="error-msg">Error loading students: ' + error.message + '</div>';
            });
    }

    function editStudent(studentId) {
        if (!db) {
            alert('Database not available');
            return;
        }

        // Get student data
        db.collection('students').doc(studentId).get()
            .then((doc) => {
                if (doc.exists) {
                    const student = doc.data();
                    
                    // Create edit form
                    const editForm = `
                        <div class="edit-form">
                            <h4>Edit Student: ${studentId}</h4>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label>Student ID</label>
                                    <input type="text" id="editStudentId" value="${student.id}" readonly>
                                </div>
                                <div class="form-group">
                                    <label>Student Name</label>
                                    <input type="text" id="editStudentName" value="${student.name}">
                                </div>
                            </div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label>Grade</label>
                                    <select id="editStudentGrade">
                                        ${document.getElementById('studentGrade').innerHTML}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Gender</label>
                                    <select id="editStudentGender">
                                        <option value="Male" ${student.gender === 'Male' ? 'selected' : ''}>Male</option>
                                        <option value="Female" ${student.gender === 'Female' ? 'selected' : ''}>Female</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-primary" onclick="saveStudentEdit('${studentId}')">💾 Save Changes</button>
                                <button class="btn btn-secondary" onclick="cancelEdit()">❌ Cancel</button>
                            </div>
                        </div>
                    `;
                    
                    // Replace student item with edit form
                    document.getElementById(`student-${studentId}`).innerHTML = editForm;
                    document.getElementById('editStudentGrade').value = student.grade;
                }
            })
            .catch((error) => {
                alert('Error loading student data: ' + error.message);
            });
    }

    function saveStudentEdit(studentId) {
        const newId = document.getElementById('editStudentId').value.trim();
        const name = document.getElementById('editStudentName').value.trim();
        const grade = document.getElementById('editStudentGrade').value;
        const gender = document.getElementById('editStudentGender').value;
        
        if (!name || !grade) {
            alert('Please fill all required fields');
            return;
        }
        
        if (!db) {
            alert('Database not available');
            return;
        }
        
        // If ID changed, we need to create a new document and delete the old one
        if (newId !== studentId) {
            db.collection('students').doc(newId).set({
                id: newId,
                name: name,
                grade: grade,
                gender: gender,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                return db.collection('students').doc(studentId).delete();
            })
            .then(() => {
                alert('Student updated successfully!');
                updateStudentsList();
            })
            .catch((error) => {
                alert('Error updating student: ' + error.message);
            });
        } else {
            // Just update the existing document
            db.collection('students').doc(studentId).update({
                name: name,
                grade: grade,
                gender: gender
            })
            .then(() => {
                alert('Student updated successfully!');
                updateStudentsList();
            })
            .catch((error) => {
                alert('Error updating student: ' + error.message);
            });
        }
    }

    function deleteStudent(studentId) {
        if (confirm(`Are you sure you want to delete student ${studentId}?`)) {
            if (!db) {
                alert('Database not available');
                return;
            }
            
            db.collection('students').doc(studentId).delete()
                .then(() => {
                    alert('Student deleted successfully!');
                    updateStudentsList();
                })
                .catch((error) => {
                    alert('Error deleting student: ' + error.message);
                });
        }
    }

    function filterStudents() {
        const filter = document.getElementById('studentFilter').value.toLowerCase();
        const classFilter = document.getElementById('filterStudentClass').value;
        const items = document.querySelectorAll('.student-item');
        
        items.forEach(item => {
            const text = item.textContent.toLowerCase();
            const grade = item.textContent.match(/\(([^)]+)\)/);
            const gradeMatch = grade ? grade[1] === classFilter : true;
            
            if ((text.includes(filter) || filter === '') && (classFilter === '' || gradeMatch)) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
    }

    // Teacher Management (Principal only)
    function addTeacher() {
        const teacherId = document.getElementById('teacherId').value.trim();
        const teacherName = document.getElementById('teacherName').value.trim();
        const teacherSubject = document.getElementById('teacherSubject').value;
        const teacherRole = document.getElementById('teacherRole').value;
        const successMsg = document.getElementById('teacherSuccess');
        
        if (!teacherId || !teacherName || !teacherSubject) {
            alert('Please fill all fields');
            return;
        }
        
        if (!db) {
            alert('Database not available');
            return;
        }
        
        db.collection('teachers').doc(teacherId).set({
            id: teacherId,
            name: teacherName,
            subject: teacherSubject,
            role: teacherRole,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => {
            document.getElementById('teacherId').value = '';
            document.getElementById('teacherName').value = '';
            successMsg.textContent = 'Teacher added successfully!';
            successMsg.style.display = 'block';
            updateTeachersList();
            updateSelectors();
            setTimeout(() => successMsg.style.display = 'none', 3000);
        })
        .catch((error) => {
            alert('Error adding teacher: ' + error.message);
        });
    }

    function updateTeachersList() {
        const teachersList = document.getElementById('teachersList');
        teachersList.innerHTML = '<div class="loading">Loading teachers...</div>';
        
        if (!db) {
            teachersList.innerHTML = '<div class="error-msg">Database not available</div>';
            return;
        }
        
        db.collection('teachers').orderBy('name').get()
            .then((querySnapshot) => {
                if (querySnapshot.empty) {
                    teachersList.innerHTML = '<div class="info-box">No teachers found. Add some teachers to get started.</div>';
                    return;
                }
                
                let html = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `
                        <div class="teacher-item" id="teacher-${data.id}">
                            <div class="item-info">
                                <strong>${data.id}</strong> - ${data.name} (${data.subject}) - ${data.role}
                            </div>
                            <div class="item-actions">
                                <button class="btn btn-warning btn-small" onclick="editTeacher('${data.id}')">✏️ Edit</button>
                                <button class="btn btn-danger btn-small" onclick="deleteTeacher('${data.id}')">🗑️ Delete</button>
                            </div>
                        </div>
                    `;
                });
                
                teachersList.innerHTML = html;
            })
            .catch((error) => {
                teachersList.innerHTML = '<div class="error-msg">Error loading teachers: ' + error.message + '</div>';
            });
    }

    function editTeacher(teacherId) {
        if (!db) {
            alert('Database not available');
            return;
        }

        // Get teacher data
        db.collection('teachers').doc(teacherId).get()
            .then((doc) => {
                if (doc.exists) {

    // Attendance Management
    function loadAttendance() {
        const selectedClass = document.getElementById('selectClass').value;
        const selectedSubject = document.getElementById('selectSubject').value;
        const selectedTeacher = document.getElementById('selectTeacher').value;
        const selectedDate = document.getElementById('startDate').value;
        
        if (!selectedClass || !selectedSubject || !selectedTeacher || !selectedDate) {
            alert('Please select all fields: Class, Subject, Teacher, and Date');
            return;
        }
        
        // Check if selected date is a weekend
        const date = new Date(selectedDate);
        const dayOfWeek = date.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) {
            alert('Attendance cannot be marked on weekends. Please select a weekday.');
            return;
        }
        
        if (!db) {
            alert('Database not available');
            return;
        }
        
        const attendanceList = document.getElementById('attendanceList');
        attendanceList.innerHTML = '<div class="loading">Loading students...</div>';
        
        // Get students for the selected class
        db.collection('students').where('grade', '==', selectedClass).get()
            .then((querySnapshot) => {
                if (querySnapshot.empty) {
                    attendanceList.innerHTML = '<div class="info-box">No students found for this class.</div>';
                    return;
                }
                
                // Get teacher name
                return db.collection('teachers').doc(selectedTeacher).get()
                    .then((teacherDoc) => {
                        const teacherName = teacherDoc.exists ? teacherDoc.data().name : 'Unknown Teacher';
                        
                        // Store current attendance session info
                        appData.currentAttendance = {
                            class: selectedClass,
                            subject: selectedSubject,
                            teacher: selectedTeacher,
                            teacherName: teacherName,
                            date: selectedDate
                        };
                        
                        // Load existing attendance if any
                        const attendanceId = `${selectedClass}_${selectedSubject}_${selectedDate}`;
                        return db.collection('attendance').doc(attendanceId).get()
                            .then((attendanceDoc) => {
                                let existingAttendance = {};
                                if (attendanceDoc.exists) {
                                    existingAttendance = attendanceDoc.data().attendance || {};
                                }
                                
                                // Build attendance list
                                let html = '';
                                querySnapshot.forEach((doc) => {
                                    const student = doc.data();
                                    const isPresent = existingAttendance[student.id] !== false; // Default to present
                                    
                                    html += `
                                        <div class="attendance-item">
                                            <div class="student-info">
                                                <strong>${student.id}</strong> - ${student.name}
                                            </div>
                                            <div class="attendance-toggle">
                                                <label class="toggle">
                                                    <input type="checkbox" ${isPresent ? 'checked' : ''} onchange="toggleAttendance('${student.id}', this.checked)">
                                                    <span class="slider"></span>
                                                </label>
                                                <span class="status ${isPresent ? 'present' : 'absent'}">${isPresent ? 'Present' : 'Absent'}</span>
                                            </div>
                                        </div>
                                    `;
                                });
                                
                                attendanceList.innerHTML = html;
                                document.getElementById('attendanceControls').style.display = 'block';
                            });
                    });
            })
            .catch((error) => {
                attendanceList.innerHTML = '<div class="error-msg">Error loading attendance: ' + error.message + '</div>';
            });
    }

    function toggleAttendance(studentId, isPresent) {

    // Reports
    function generateReport() {
        const reportClass = document.getElementById('reportClass').value;
        const reportSubject = document.getElementById('reportSubject').value;
        const reportMonth = document.getElementById('reportMonth').value;
        
        if (!reportClass || !reportSubject || !reportMonth) {
            alert('Please select Class, Subject, and Month');
            return;
        }
        
        if (!db) {
            alert('Database not available');
            return;
        }
        
        const reportOutput = document.getElementById('reportOutput');
        reportOutput.innerHTML = '<div class="loading">Generating report...</div>';
        
        // Get start and end dates for the selected month
        const startDate = reportMonth + '-01';
        const endDate = new Date(reportMonth + '-01');
        endDate.setMonth(endDate.getMonth() + 1);
        endDate.setDate(0); // Last day of the month
        const endDateStr = endDate.toISOString().split('T')[0];
        
        // Get attendance records for the selected class, subject, and month
        db.collection('attendance')
            .where('class', '==', reportClass)
            .where('subject', '==', reportSubject)
            .where('date', '>=', startDate)
            .where('date', '<=', endDateStr)
            .get()
            .then((querySnapshot) => {
                if (querySnapshot.empty) {
                    reportOutput.innerHTML = '<div class="info-box">No attendance records found for the selected criteria.</div>';
                    return;
                }
                
                // Get all students for the class
                return db.collection('students').where('grade', '==', reportClass).get()
                    .then((studentsSnapshot) => {
                        const students = {};
                        studentsSnapshot.forEach(doc => {
                            students[doc.data().id] = doc.data();
                        });
                        
                        // Process attendance data
                        const attendanceByDate = {};
                        const studentStats = {};
                        
                        // Initialize student stats
                        Object.keys(students).forEach(studentId => {
                            studentStats[studentId] = { present: 0, total: 0 };
                        });
                        
                        querySnapshot.forEach(doc => {
                            const record = doc.data();
                            const date = record.date;
                            
                            if (!attendanceByDate[date]) {
                                attendanceByDate[date] = {};
                            }
                            
                            Object.entries(record.attendance).forEach(([studentId, isPresent]) => {
                                attendanceByDate[date][studentId] = isPresent;
                                if (studentStats[studentId]) {
                                    studentStats[studentId].total++;
                                    if (isPresent) {
                                        studentStats[studentId].present++;
                                    }
                                }
                            });
                        });
                        
                        // Generate report HTML
                        let html = `<h3>Attendance Report for ${reportClass} - ${reportSubject} (${reportMonth})</h3>`;
                        
                        // Summary table
                        html += `<h4>Summary</h4>`;
                        html += `<table class="report-table"><thead><tr><th>Student ID</th><th>Student Name</th><th>Present</th><th>Absent</th><th>Attendance %</th></tr></thead><tbody>`;
                        
                        Object.entries(studentStats).forEach(([studentId, stats]) => {
                            const student = students[studentId];
                            const percentage = stats.total > 0 ? ((stats.present / stats.total) * 100).toFixed(1) : '0.0';
                            html += `<tr>
                                <td>${studentId}</td>
                                <td>${student.name}</td>
                                <td>${stats.present}</td>
                                <td>${stats.total - stats.present}</td>
                                <td>${percentage}%</td>
                            </tr>`;
                        });
                        
                        html += `</tbody></table>`;
                        
                        // Detailed daily attendance
                        html += `<h4>Daily Attendance</h4>`;
                        html += `<table class="report-table"><thead><tr><th>Date</th>`;
                        
                        Object.keys(students).forEach(studentId => {
                            html += `<th>${studentId}</th>`;
                        });
                        
                        html += `</tr></thead><tbody>`;
                        
                        Object.keys(attendanceByDate).sort().forEach(date => {
                            html += `<tr><td>${date}</td>`;
                            Object.keys(students).forEach(studentId => {
                                const status = attendanceByDate[date][studentId];
                                html += `<td class="${status ? 'present' : 'absent'}">${status ? 'P' : 'A'}</td>`;
                            });
                            html += `</tr>`;
                        });
                        
                        html += `</tbody></table>`;
                        
                        reportOutput.innerHTML = html;
                        document.getElementById('pdfReportSection').style.display = 'block';
                    });
            })
            .catch((error) => {
                reportOutput.innerHTML = '<div class="error-msg">Error generating report: ' + error.message + '</div>';
            });
    }

    function generatePdfReport() {

        if (!db) {
            alert('Database not available');
            return;
        }
        
        const viewOutput = document.getElementById('viewOutput');
        viewOutput.innerHTML = '<div class="loading">Loading attendance records...</div>';
        
        const attendanceId = `${viewClass}_${viewSubject}_${viewDate}`;
        if (viewTeacher) {
            attendanceId += `_${viewTeacher}`;
        }
        
        db.collection('attendance').doc(attendanceId).get()
            .then((doc) => {
                if (!doc.exists) {
                    viewOutput.innerHTML = '<div class="info-box">No attendance record found for the selected criteria.</div>';
                    return;
                }
                
                const record = doc.data();
                
                // Get student details
                return db.collection('students').where('grade', '==', viewClass).get()
                    .then((studentsSnapshot) => {
                        const students = {};
                        studentsSnapshot.forEach(studentDoc => {
                            const student = studentDoc.data();
                            students[student.id] = student;
                        });
                        
                        let html = `<h3>Attendance Record for ${viewClass} - ${viewSubject} on ${viewDate}</h3>`;
                        html += `<p><strong>Teacher:</strong> ${record.teacherName}</p>`;
                        
                        html += `<table class="report-table"><thead><tr><th>Student ID</th><th>Student Name</th><th>Status</th></tr></thead><tbody>`;
                        
                        Object.entries(record.attendance).forEach(([studentId, isPresent]) => {
                            const student = students[studentId];
                            if (student) {
                                html += `<tr>
                                    <td>${studentId}</td>
                                    <td>${student.name}</td>
                                    <td class="${isPresent ? 'present' : 'absent'}">${isPresent ? 'Present' : 'Absent'}</td>
                                </tr>`;
                            }
                        });
                        
                        html += `</tbody></table>`;
                        
                        viewOutput.innerHTML = html;
                    });
            })
            .catch((error) => {
                viewOutput.innerHTML = '<div class="error-msg">Error loading attendance record: ' + error.message + '</div>';
            });
    }

    // Dashboard
    function updateDashboard() {
        if (!db) {
            document.getElementById('dashboardStats').innerHTML = '<div class="error-msg">Database not available</div>';
            return;
        }
        
        // Get counts for dashboard
        Promise.all([
            db.collection('students').get(),
            db.collection('teachers').get(),
            db.collection('subjects').get(),
            db.collection('grades').get(),
            db.collection('attendance').where('date', '==', new Date().toISOString().split('T')[0]).get()
        ])
        .then(([studentsSnapshot, teachersSnapshot, subjectsSnapshot, gradesSnapshot, todayAttendanceSnapshot]) => {
            const stats = {
                students: studentsSnapshot.size,
                teachers: teachersSnapshot.size,
                subjects: subjectsSnapshot.size,
                classes: gradesSnapshot.size,
                todayRecords: todayAttendanceSnapshot.size
            };
            
            document.getElementById('dashboardStats').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>${stats.students}</h3>
                        <p>Total Students</p>
                    </div>
                    <div class="stat-card">
                        <h3>${stats.teachers}</h3>
                        <p>Total Teachers</p>
                    </div>
                    <div class="stat-card">
                        <h3>${stats.subjects}</h3>
                        <p>Total Subjects</p>
                    </div>
                    <div class="stat-card">
                        <h3>${stats.classes}</h3>
                        <p>Total Classes</p>
                    </div>
                    <div class="stat-card">
                        <h3>${stats.todayRecords}</h3>
                        <p>Today's Attendance Records</p>
                    </div>
                </div>
            `;
        })
        .catch((error) => {
            document.getElementById('dashboardStats').innerHTML = '<div class="error-msg">Error loading dashboard: ' + error.message + '</div>';
        });
    }

    // Utility function to cancel edit
    function cancelEdit() {
        // This will refresh the lists, removing any edit forms
        updateStudentsList();
        if (appData.userRole === 'principal') {
            updateTeachersList();
        }
        updateSubjectsList();
        updateGradesList();
    }
</script>
