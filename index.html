      function initializeFirebase() {
           console.log("DEBUG: Attempting Firebase Initialization...");
           try {
               if (typeof firebase === 'undefined') throw new Error("Firebase SDK global object not found.");
               if (typeof firebaseConfig === 'undefined' || !firebaseConfig.apiKey || firebaseConfig.apiKey.includes("YOUR_")) throw new Error("Firebase config missing/incomplete.");
               if (!firebase.apps.length) { app = firebase.initializeApp(firebaseConfig); console.log("DEBUG: Firebase Initialized successfully."); }
               else { app = firebase.app(); console.log("DEBUG: Firebase App already initialized."); }
               auth = firebase.auth();
               db = firebase.firestore();
               FieldValue = firebase.firestore.FieldValue;
               console.log("DEBUG: Firebase Auth and Firestore services obtained.");
               firebaseInitialized = true; // Set flag
               return true;
           } catch (e) {
               console.error("CRITICAL: Error initializing Firebase SDK", e);
               const loadingIndicatorEl = document.getElementById('loadingIndicator');
               const loadingTextEl = document.getElementById('loadingText');
               if (loadingIndicatorEl) {
                   const errorMsg = `CRITICAL ERROR: Could not initialize Firebase. ${e.message}. Check Console/Config.`;
                   if (loadingTextEl) { loadingTextEl.innerHTML = `<strong style='color: red;'>${errorMsg}</strong>`; }
                   else { loadingIndicatorEl.innerHTML = `<strong style='color: red;'>${errorMsg}</strong>`; }
                   loadingIndicatorEl.style.color = "red";
                   const loginScreenEl = document.getElementById('loginScreen');
                   const appContentEl = document.getElementById('appContent');
                   if(loginScreenEl) loginScreenEl.style.display = 'none';
                   if(appContentEl) appContentEl.style.display = 'none';
               }
               firebaseInitialized = false;
               return false;
           }
      }
    </script>
