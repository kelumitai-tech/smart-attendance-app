<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance Tracker</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #005A9C 0%, #0077cc 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        .connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .connection-good {
            background: #4CAF50;
            color: white;
        }
        .connection-bad {
            background: #f44336;
            color: white;
        }
        .connection-testing {
            background: #ff9800;
            color: white;
        }
        .content { padding: 40px; }
        .login-box { max-width: 500px; margin: 0 auto; }
        .debug-info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        /* Rest of your CSS styles... */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Smart Attendance Tracker</h1>
            <p>Efficient Student Attendance Management System</p>
            <div id="connectionStatus" class="connection-status connection-bad">🔴 Disconnected</div>
        </div>

        <div class="content" id="loginScreen">
            <div class="login-box">
                <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Welcome Back</h2>
                
                <div id="connectionDebug" class="debug-info" style="display: none;">
                    <!-- Debug information will appear here -->
                </div>

                <div id="loginForm">
                    <div style="background: #e7f5e7; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <h4>🔧 Connection Status</h4>
                        <p id="connectionDetails">Testing connection to Supabase...</p>
                    </div>
                    
                    <div class="form-group">
                        <label>Login As</label>
                        <select id="loginRole">
                            <option value="principal">Principal (Admin)</option>
                            <option value="classTeacher">Class Teacher</option>
                            <option value="subjectTeacher">Subject Teacher</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" value="test@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" value="password123">
                    </div>
                    <button class="btn btn-primary btn-full" id="loginBtn">🔐 Login</button>
                    <div class="error-msg" id="loginError"></div>
                    
                    <!-- Debug buttons -->
                    <div style="text-align: center; margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                        <button class="btn btn-warning btn-small" onclick="testSupabaseConnection()">Test Connection</button>
                        <button class="btn btn-secondary btn-small" onclick="showDebugInfo()">Show Debug Info</button>
                        <button class="btn btn-info btn-small" onclick="checkCors()">Check CORS</button>
                    </div>
                    
                    <!-- Quick test credentials -->
                    <div style="margin-top: 20px; padding: 15px; background: #f0f8ff; border-radius: 8px;">
                        <h4>🚀 Quick Test</h4>
                        <p><small>Use these test credentials or create your own account:</small></p>
                        <p><strong>Email:</strong> test@example.com<br>
                        <strong>Password:</strong> password123</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_CONFIG = {
            supabaseUrl: 'https://gqczamhaurawfpnakboa.supabase.co',
            supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxY3phbWhhdXJhd2ZwbmFrYm9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI0ODgxMjYsImV4cCI6MjA3ODA2NDEyNn0.RJIz-U0kigyHX00wigmAcxfx7TVMU77_xLyzOhAjdpU'
        };

        let supabase;
        let connectionDebug = '';

        // Enhanced connection testing
        async function initializeSupabase() {
            const statusElement = document.getElementById('connectionStatus');
            const detailsElement = document.getElementById('connectionDetails');
            
            try {
                console.log("🔄 Initializing Supabase...");
                statusElement.textContent = "🔄 Testing...";
                statusElement.className = "connection-status connection-testing";
                detailsElement.textContent = "Testing connection to Supabase...";
                
                connectionDebug = "=== SUPABASE CONNECTION TEST ===\n\n";
                connectionDebug += `URL: ${SUPABASE_CONFIG.supabaseUrl}\n`;
                connectionDebug += `Key: ${SUPABASE_CONFIG.supabaseKey.substring(0, 20)}...\n\n`;

                // Test 1: Basic URL connectivity
                connectionDebug += "1. Testing Supabase URL reachability...\n";
                let urlTestPassed = false;
                try {
                    const response = await fetch(SUPABASE_CONFIG.supabaseUrl, {
                        method: 'HEAD',
                        mode: 'cors'
                    });
                    connectionDebug += `✅ URL reachable (HTTP ${response.status})\n`;
                    urlTestPassed = true;
                } catch (error) {
                    connectionDebug += `❌ URL not reachable: ${error.message}\n`;
                    throw new Error(`Cannot connect to Supabase URL: ${error.message}`);
                }

                if (!urlTestPassed) {
                    throw new Error('Supabase URL is not reachable');
                }

                // Test 2: Initialize Supabase client
                connectionDebug += "\n2. Initializing Supabase client...\n";
                try {
                    supabase = window.supabase.createClient(
                        SUPABASE_CONFIG.supabaseUrl, 
                        SUPABASE_CONFIG.supabaseKey,
                        {
                            auth: {
                                persistSession: true,
                                autoRefreshToken: true,
                                detectSessionInUrl: true
                            }
                        }
                    );
                    connectionDebug += "✅ Supabase client created\n";
                } catch (error) {
                    connectionDebug += `❌ Client creation failed: ${error.message}\n`;
                    throw error;
                }

                // Test 3: Test database access
                connectionDebug += "\n3. Testing database access...\n";
                try {
                    const { data, error } = await supabase
                        .from('users')
                        .select('count')
                        .limit(1);

                    if (error) {
                        if (error.message.includes('JWT')) {
                            connectionDebug += "⚠️  Database accessible but JWT error (expected without auth)\n";
                        } else if (error.message.includes('relation') || error.message.includes('does not exist')) {
                            connectionDebug += "⚠️  Database accessible but tables don't exist yet\n";
                        } else {
                            connectionDebug += `❌ Database error: ${error.message}\n`;
                            throw error;
                        }
                    } else {
                        connectionDebug += "✅ Database access successful\n";
                    }
                } catch (error) {
                    connectionDebug += `❌ Database test failed: ${error.message}\n`;
                    // Don't throw here - we might still have basic connectivity
                }

                // Test 4: Test auth configuration
                connectionDebug += "\n4. Testing auth configuration...\n";
                try {
                    const { data: authData, error: authError } = await supabase.auth.getSession();
                    if (authError) {
                        connectionDebug += `⚠️  Auth check: ${authError.message}\n`;
                    } else {
                        connectionDebug += "✅ Auth configuration OK\n";
                    }
                } catch (error) {
                    connectionDebug += `⚠️  Auth test: ${error.message}\n`;
                }

                console.log("✅ Supabase initialized successfully!");
                connectionDebug += "\n🎉 All connection tests completed!\n";
                
                statusElement.textContent = "✅ Connected";
                statusElement.className = "connection-status connection-good";
                detailsElement.textContent = "Successfully connected to Supabase!";
                
                return true;
                
            } catch (error) {
                console.error("❌ Supabase initialization failed:", error);
                connectionDebug += `\n💥 FINAL ERROR: ${error.message}\n`;
                
                statusElement.textContent = "❌ Connection Failed";
                statusElement.className = "connection-status connection-bad";
                detailsElement.textContent = `Connection failed: ${error.message}`;
                
                return false;
            }
        }

        // Enhanced connection test function
        async function testSupabaseConnection() {
            const resultDiv = document.getElementById('loginError');
            resultDiv.innerHTML = '<div style="background: #fff3cd; padding: 15px; border-radius: 8px;">Testing connection to Supabase...</div>';
            resultDiv.style.display = 'block';
            
            const isConnected = await initializeSupabase();
            
            if (isConnected) {
                resultDiv.innerHTML = `
                    <div style="background: #e7f5e7; color: #2e7d32; padding: 15px; border-radius: 8px;">
                        <h4>🎉 Connection Successful!</h4>
                        <p>Your Supabase configuration is working correctly.</p>
                        <button class="btn btn-small" onclick="showDebugInfo()" style="margin-top: 10px;">View Detailed Log</button>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div style="background: #fee; color: #c00; padding: 15px; border-radius: 8px;">
                        <h4>❌ Connection Failed</h4>
                        <p>Could not connect to Supabase. Check the debug information for details.</p>
                        <button class="btn btn-small" onclick="showDebugInfo()" style="margin-top: 10px;">View Detailed Log</button>
                    </div>
                `;
            }
        }

        function showDebugInfo() {
            const debugDiv = document.getElementById('connectionDebug');
            debugDiv.innerHTML = `<pre>${connectionDebug}</pre>`;
            debugDiv.style.display = 'block';
        }

        // CORS testing function
        async function checkCors() {
            const resultDiv = document.getElementById('loginError');
            resultDiv.innerHTML = '<div style="background: #fff3cd; padding: 15px; border-radius: 8px;">Testing CORS configuration...</div>';
            resultDiv.style.display = 'block';
            
            let corsDebug = "=== CORS TEST ===\n\n";
            
            try {
                // Test different endpoints
                const endpoints = [
                    { url: SUPABASE_CONFIG.supabaseUrl, name: "Main URL" },
                    { url: `${SUPABASE_CONFIG.supabaseUrl}/rest/v1/`, name: "REST API" },
                    { url: `${SUPABASE_CONFIG.supabaseUrl}/auth/v1/`, name: "Auth API" }
                ];
                
                for (const endpoint of endpoints) {
                    corsDebug += `Testing ${endpoint.name}...\n`;
                    try {
                        const response = await fetch(endpoint.url, {
                            method: 'OPTIONS',
                            mode: 'cors'
                        });
                        corsDebug += `✅ ${endpoint.name}: CORS allowed (HTTP ${response.status})\n`;
                        corsDebug += `   Access-Control-Allow-Origin: ${response.headers.get('Access-Control-Allow-Origin') || 'Not set'}\n`;
                    } catch (error) {
                        corsDebug += `❌ ${endpoint.name}: CORS blocked - ${error.message}\n`;
                    }
                    corsDebug += '\n';
                }
                
                resultDiv.innerHTML = `
                    <div style="background: #e3f2fd; padding: 15px; border-radius: 8px;">
                        <h4>🔍 CORS Test Results</h4>
                        <pre style="background: white; padding: 10px; border-radius: 4px; margin-top: 10px;">${corsDebug}</pre>
                    </div>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <div style="background: #fee; color: #c00; padding: 15px; border-radius: 8px;">
                        <h4>❌ CORS Test Failed</h4>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Initialize the application
        window.onload = async function() {
            console.log("🚀 Starting Smart Attendance Tracker...");
            
            // Test connection immediately
            await initializeSupabase();
            
            // Set up event listeners
            document.getElementById('loginBtn').addEventListener('click', doLogin);
        };

        // Login function
        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorMsg = document.getElementById('loginError');
            
            if (!email || !password) {
                errorMsg.textContent = 'Please enter both email and password';
                errorMsg.style.display = 'block';
                return;
            }
            
            // Show loading state
            const loginBtn = document.getElementById('loginBtn');
            const originalText = loginBtn.textContent;
            loginBtn.textContent = 'Logging in...';
            loginBtn.disabled = true;
            
            try {
                // Ensure we're connected
                const isConnected = await initializeSupabase();
                if (!isConnected) {
                    throw new Error('Cannot connect to Supabase. Please check your connection and try again.');
                }
                
                // Attempt to sign up first (will work even if user exists)
                const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (signUpError && !signUpError.message.includes('User already registered')) {
                    throw signUpError;
                }
                
                // Then try to sign in
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    // If it's a credentials error, try to create the user properly
                    if (error.message.includes('Invalid login credentials')) {
                        // Create user in users table if it doesn't exist
                        const { error: userError } = await supabase
                            .from('users')
                            .insert([{
                                id: data?.user?.id || 'temp',
                                email: email,
                                role: 'principal'
                            }])
                            .select();
                            
                        if (userError && !userError.message.includes('duplicate key')) {
                            console.warn('Could not create user record:', userError);
                        }
                        
                        throw new Error('Account created! Please try logging in again.');
                    }
                    throw error;
                }

                console.log("✅ Login successful!");
                errorMsg.style.display = 'none';
                
                // Show success message
                errorMsg.innerHTML = `
                    <div style="background: #e7f5e7; color: #2e7d32; padding: 15px; border-radius: 8px;">
                        <h4>🎉 Login Successful!</h4>
                        <p>Welcome to Smart Attendance Tracker!</p>
                    </div>
                `;
                errorMsg.style.display = 'block';
                
            } catch (error) {
                console.error("Login error:", error);
                errorMsg.textContent = 'Login: ' + error.message;
                errorMsg.style.display = 'block';
            } finally {
                // Restore button state
                loginBtn.textContent = originalText;
                loginBtn.disabled = false;
            }
        }

        // Add some basic styling for buttons
        const style = document.createElement('style');
        style.textContent = `
            .btn {
                padding: 10px 20px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
                transition: all 0.3s;
            }
            .btn-primary {
                background: #005A9C;
                color: white;
            }
            .btn-primary:hover {
                background: #004a80;
            }
            .btn-warning {
                background: #ff9800;
                color: white;
            }
            .btn-secondary {
                background: #6c757d;
                color: white;
            }
            .btn-info {
                background: #17a2b8;
                color: white;
            }
            .btn-small {
                padding: 6px 12px;
                font-size: 12px;
            }
            .form-group {
                margin-bottom: 15px;
            }
            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-weight: 600;
            }
            .form-group input, .form-group select {
                width: 100%;
                padding: 10px;
                border: 2px solid #e0e0e0;
                border-radius: 6px;
                font-size: 14px;
            }
            .error-msg {
                padding: 10px;
                border-radius: 6px;
                margin-top: 10px;
                text-align: center;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
