<head>
    <meta charset="UTF-8">

    <style>
        /* Your existing CSS styles remain the same */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        .tab-content.active { display: block; }
        .card {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .card h3 {
            color: #005A9C;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;

        th {
            background: #005A9C;

        }
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 20px;

            border: 2px solid white;

            border-radius: 6px;

        .info-box {
            background: #e3f2fd;

        }
        .grid-2 {
            display: grid;

        .stats-card {

        .principal-only { display: none; }
        .class-teacher-only { display: none; }
        .subject-teacher-only { display: none; }
        .filter-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        .attendance-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .student-item, .teacher-item, .subject-item, .grade-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #005A9C;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info {
            flex: 1;
        }
        .item-actions {
            display: flex;
            gap: 10px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .attendance-summary {
            background: #e8f5e8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #2e7d32;
            font-weight: bold;
            text-align: center;
        }
        .present { color: #4CAF50; font-weight: bold; }
        .absent { color: #f44336; font-weight: bold; }
        .teacher-info {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ffc107;
        }
        .weekend-date {
            background-color: #f5f5f5;
            color: #999;
            cursor: not-allowed;
        }
        .pdf-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
        }
        .pdf-btn:hover {
            background: #b71c1c;
        }
        .edit-form {
            background: #f0f8ff;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #cce7ff;
        }
        .edit-form h4 {
            color: #005A9C;
            margin-bottom: 15px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            table { font-size: 14px; }
            th, td { padding: 8px; }
            .student-item, .teacher-item, .subject-item, .grade-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .item-actions {
                margin-top: 10px;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

                    <strong style="color: #005A9C;">Developer:</strong> Kelum Konara<br>
                    <strong style="color: #005A9C;">SmartSoft</strong> | The Mobile Apps Developer<br>
                    📞 <strong>0714469232</strong>

        <!-- Main App -->
        <div class="content app-main" id="appContent">

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCPPqnPEfVLkc7K29YPV7GDkIaC6tcHn4E",
            authDomain: "smart-attendance-tracker-5573b.firebaseapp.com",
            projectId: "smart-attendance-tracker-5573b",
            storageBucket: "smart-attendance-tracker-5573b.firebasestorage.app",
            messagingSenderId: "342955621552",
            appId: "1:342955621552:web:790e9b4fb8a4e8edec4f75",
            measurementId: "G-01LEWN7WHX"
        };

        // Initialize Firebase
        let auth, db;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            } else {
                firebase.app();
            }
            auth = firebase.auth();
            db = firebase.firestore();
            console.log("✅ Firebase initialized successfully!");
        } catch (error) {
            console.error("❌ Firebase initialization error:", error);
        }

        // Global app data
        const appData = {
            currentUser: null,
            userRole: null,
            currentAttendance: {},
            currentTeacher: null,
            editingItem: null
        };

        // Initialize the application
        window.onload = function() {
            setupEventListeners();
            setTodayDate();
            checkAuthState();
        };

        function setupEventListeners() {
            // Authentication
            document.getElementById('loginBtn').addEventListener('click', doLogin);
            document.getElementById('googleBtn').addEventListener('click', googleLogin);
            document.getElementById('registerBtn').addEventListener('click', showRegistration);
            document.getElementById('logoutBtn').addEventListener('click', doLogout);
            
            // Navigation
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.addEventListener('click', function() {
                    showTab(this.getAttribute('data-tab'));
                });
            });
            
            // Grades Management - FIXED
            document.getElementById('addClassBtn').addEventListener('click', addGradeClass);
            document.getElementById('gradeFilter').addEventListener('keyup', filterGrades);
            
            // Other event listeners...
        }

        // FIXED: Add Grade and Class Function
        function addGradeClass() {
            const grade = document.getElementById('newGrade').value;
            const className = document.getElementById('className').value.trim().toUpperCase();
            const successMsg = document.getElementById('classSuccess');
            
            if (!grade || !className) {
                alert('Please select grade and enter class name');
                return;
            }
            
            // Create full class name (e.g., "Grade 6 - A")
            const fullClassName = `${grade} - ${className}`;
            
            // Check if this grade-class combination already exists
            db.collection('grades').where('fullClass', '==', fullClassName).get()
                .then((querySnapshot) => {
                    if (!querySnapshot.empty) {
                        alert('This grade and class combination already exists!');
                        return;
                    }
                    
                    // Add new grade-class to Firestore
                    return db.collection('grades').add({
                        grade: grade,
                        class: className,
                        fullClass: fullClassName,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    // Show success message
                    successMsg.textContent = `Grade ${fullClassName} added successfully!`;
                    successMsg.style.display = 'block';
                    
                    // Clear form
                    document.getElementById('newGrade').value = '';
                    document.getElementById('className').value = '';
                    
                    // Refresh grades list
                    loadGradesList();
                    
                    // Update all dropdowns that use grades
                    updateGradeSelectors();
                    
                    // Hide success message after 3 seconds
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 3000);
                })
                .catch((error) => {
                    console.error("Error adding grade:", error);
                    alert('Error adding grade: ' + error.message);
                });
        }

        // FIXED: Load Grades List
        function loadGradesList() {
            const gradesList = document.getElementById('gradesList');
            gradesList.innerHTML = '<div class="loading">Loading grades...</div>';
            
            db.collection('grades').orderBy('grade').orderBy('class').get()
                .then((querySnapshot) => {
                    if (querySnapshot.empty) {
                        gradesList.innerHTML = '<div class="info-box">No grades found. Add some grades to get started.</div>';
                        return;
                    }
                    
                    let html = '';
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        html += `
                            <div class="grade-item" id="grade-${doc.id}">
                                <div class="item-info">
                                    <strong>${data.fullClass}</strong>
                                    <div style="color: #666; font-size: 0.9em;">
                                        Grade: ${data.grade} | Class: ${data.class}
                                    </div>
                                </div>
                                <div class="item-actions">
                                    <button class="btn btn-warning btn-small" onclick="editGradeClass('${doc.id}')">✏️ Edit</button>
                                    <button class="btn btn-danger btn-small" onclick="deleteGradeClass('${doc.id}')">🗑️ Delete</button>
                                </div>
                            </div>
                        `;
                    });
                    
                    gradesList.innerHTML = html;
                })
                .catch((error) => {
                    gradesList.innerHTML = '<div class="error-msg">Error loading grades: ' + error.message + '</div>';
                });
        }

        // FIXED: Edit Grade and Class
        function editGradeClass(gradeId) {
            // Get grade data from Firestore
            db.collection('grades').doc(gradeId).get()
                .then((doc) => {
                    if (doc.exists) {
                        const gradeData = doc.data();
                        
                        // Create edit form
                        const editForm = `
                            <div class="edit-form">
                                <h4>Edit Grade & Class</h4>
                                <div class="grid-2">
                                    <div class="form-group">
                                        <label>Grade</label>
                                        <select id="editGrade">
                                            <option value="">-- Select Grade --</option>
                                            <option value="Grade 6" ${gradeData.grade === 'Grade 6' ? 'selected' : ''}>Grade 6</option>
                                            <option value="Grade 7" ${gradeData.grade === 'Grade 7' ? 'selected' : ''}>Grade 7</option>
                                            <option value="Grade 8" ${gradeData.grade === 'Grade 8' ? 'selected' : ''}>Grade 8</option>
                                            <option value="Grade 9" ${gradeData.grade === 'Grade 9' ? 'selected' : ''}>Grade 9</option>
                                            <option value="Grade 10" ${gradeData.grade === 'Grade 10' ? 'selected' : ''}>Grade 10</option>
                                            <option value="Grade 11" ${gradeData.grade === 'Grade 11' ? 'selected' : ''}>Grade 11</option>
                                            <option value="Grade 12" ${gradeData.grade === 'Grade 12' ? 'selected' : ''}>Grade 12</option>
                                            <option value="Grade 13" ${gradeData.grade === 'Grade 13' ? 'selected' : ''}>Grade 13</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Class Name</label>
                                        <input type="text" id="editClassName" value="${gradeData.class}">
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button class="btn btn-primary" onclick="saveGradeEdit('${gradeId}')">💾 Save Changes</button>
                                    <button class="btn btn-secondary" onclick="cancelGradeEdit()">❌ Cancel</button>
                                </div>
                            </div>
                        `;
                        
                        // Replace the grade item with edit form
                        document.getElementById(`grade-${gradeId}`).innerHTML = editForm;
                    }
                })
                .catch((error) => {
                    alert('Error loading grade data: ' + error.message);
                });
        }

        // FIXED: Save Grade Edit
        function saveGradeEdit(gradeId) {
            const grade = document.getElementById('editGrade').value;
            const className = document.getElementById('editClassName').value.trim().toUpperCase();
            
            if (!grade || !className) {
                alert('Please select grade and enter class name');
                return;
            }
            
            const newFullClass = `${grade} - ${className}`;
            
            // Check if the new combination already exists (excluding current one)
            db.collection('grades')
                .where('fullClass', '==', newFullClass)
                .get()
                .then((querySnapshot) => {
                    let exists = false;
                    querySnapshot.forEach((doc) => {
                        if (doc.id !== gradeId) {
                            exists = true;
                        }
                    });
                    
                    if (exists) {
                        alert('This grade and class combination already exists!');
                        return;
                    }
                    
                    // Update the grade in Firestore
                    return db.collection('grades').doc(gradeId).update({
                        grade: grade,
                        class: className,
                        fullClass: newFullClass
                    });
                })
                .then(() => {
                    alert('Grade updated successfully!');
                    loadGradesList();
                    updateGradeSelectors();
                })
                .catch((error) => {
                    alert('Error updating grade: ' + error.message);
                });
        }

        // FIXED: Delete Grade and Class
        function deleteGradeClass(gradeId) {
            if (confirm('Are you sure you want to delete this grade and class? This action cannot be undone.')) {
                db.collection('grades').doc(gradeId).delete()
                    .then(() => {
                        alert('Grade deleted successfully!');
                        loadGradesList();
                        updateGradeSelectors();
                    })
                    .catch((error) => {
                        alert('Error deleting grade: ' + error.message);
                    console.error("Error deleting grade:", error);
                    // Check if there are students in this grade
                    db.collection('students').where('grade', '==', document.getElementById(`grade-${gradeId}`).querySelector('.item-info strong').textContent).get()
                        .then((studentSnapshot) => {
                            if (!studentSnapshot.empty) {
                                alert('Cannot delete this grade because there are students assigned to it. Please reassign or delete those students first.');
                            }
                        });
                    });
            }
        }

        // FIXED: Cancel Grade Edit
        function cancelGradeEdit() {
            loadGradesList();
        }

        // FIXED: Update Grade Selectors in all dropdowns
        function updateGradeSelectors() {
            db.collection('grades').orderBy('grade').orderBy('class').get()
                .then((querySnapshot) => {
                    let options = '<option value="">-- Select Class --</option>';
                    
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        options += `<option value="${data.fullClass}">${data.fullClass}</option>`;
                    });
                    
                    // Update all grade dropdowns
                    const gradeSelectors = [
                        'selectClass', 'studentGrade', 'reportClass', 'viewClass', 'filterStudentClass'
                    ];
                    
                    gradeSelectors.forEach(selectorId => {
                        const select = document.getElementById(selectorId);
                        if (select) {
                            select.innerHTML = selectorId === 'filterStudentClass' 
                                ? '<option value="">All Classes</option>' + options.replace('<option value="">-- Select Class --</option>', '')
                                : options;
                        }
                    });
                })
                .catch((error) => {
                    console.error("Error updating grade selectors:", error);
                });
        }

        // FIXED: Filter Grades
        function filterGrades() {
            const filter = document.getElementById('gradeFilter').value.toLowerCase();
            const items = document.querySelectorAll('.grade-item');
            
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(filter)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // FIXED: Show Grades Tab
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            
            // Load data when switching to specific tabs
            if (tabName === 'grades') {
                loadGradesList();
            }
            if (tabName === 'students') updateStudentsList();
            if (tabName === 'teachers') updateTeachersList();
            if (tabName === 'subjects') updateSubjectsList();
            if (tabName === 'dashboard') updateDashboard();
        }

        // Other existing functions (authentication, etc.) remain the same
        function setTodayDate() {
            const today = new Date();
            const formattedDate = today.toISOString().split('T')[0];
            document.getElementById('startDate').value = formattedDate;
            document.getElementById('viewDate').value = formattedDate;
            
            const currentMonth = formattedDate.substring(0, 7);
            document.getElementById('reportMonth').value = currentMonth;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const displayDate = today.toLocaleDateString('en-US', options);
            document.getElementById('currentDateDisplay').textContent = displayDate;
        }

        function checkAuthState() {
            if (auth) {
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        getUserRole(user.uid).then(role => {
                            appData.currentUser = user;
                            appData.userRole = role;
                            showApp(role);
                        });
                    } else {
                        document.getElementById('loginScreen').style.display = 'block';
                        document.getElementById('appContent').style.display = 'none';
                    }
                });
            }
        }

        async function getUserRole(uid) {
            try {
                const doc = await db.collection('users').doc(uid).get();
                if (doc.exists) {
                    return doc.data().role;
                } else {
                    return 'subjectTeacher';
                }
            } catch (error) {
                console.error("Error getting user role:", error);
                return 'subjectTeacher';
            }
        }

        function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorMsg = document.getElementById('loginError');
            
            if (!email || !password) {
                errorMsg.textContent = 'Please enter both email and password';
                errorMsg.style.display = 'block';
                return;
            }
            
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    return getUserRole(userCredential.user.uid);
                })
                .then((role) => {
                    appData.userRole = role;
                    showApp(role);
                    errorMsg.style.display = 'none';
                })
                .catch((error) => {
                    errorMsg.textContent = 'Login failed: ' + error.message;
                    errorMsg.style.display = 'block';
                });
        }

        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    const selectedRole = document.getElementById('loginRole').value;
                    
                    return db.collection('users').doc(user.uid).set({
                        email: user.email,
                        role: selectedRole,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(() => selectedRole);
                })
                .then((role) => {
                    appData.userRole = role;
                    showApp(role);
                })
                .catch((error) => {
                    document.getElementById('loginError').textContent = 'Google login failed: ' + error.message;
                    document.getElementById('loginError').style.display = 'block';
                });
        }

        function showRegistration() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const role = document.getElementById('loginRole').value;
            const errorMsg = document.getElementById('loginError');
            
            if (!email || !password) {
                errorMsg.textContent = 'Please enter both email and password';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorMsg.textContent = 'Password should be at least 6 characters';
                errorMsg.style.display = 'block';
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    return db.collection('users').doc(user.uid).set({
                        email: email,
                        role: role,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    appData.userRole = role;
                    showApp(role);
                    errorMsg.style.display = 'none';
                })
                .catch((error) => {
                    errorMsg.textContent = 'Registration failed: ' + error.message;
                    errorMsg.style.display = 'block';
                });
        }

        function showApp(role) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            
            // Set role badge
            let roleText = '';
            if (role === 'principal') roleText = 'Principal';
            else if (role === 'classTeacher') roleText = 'Class Teacher';
            else roleText = 'Subject Teacher';
            document.getElementById('roleBadge').textContent = roleText;
            
            // Update role-based visibility
            updateRoleBasedVisibility(role);
            
            // Load initial data including grades
            loadGradesList();
            updateGradeSelectors();
        }

        function updateRoleBasedVisibility(role) {
            // Hide all role-specific elements
            document.querySelectorAll('.principal-only, .class-teacher-only, .subject-teacher-only').forEach(el => {
                el.style.display = 'none';
            });
            
            // Show elements based on role
            if (role === 'principal') {
                document.querySelectorAll('.principal-only').forEach(el => {
                    el.style.display = 'block';
                });
            } else if (role === 'classTeacher') {
                document.querySelectorAll('.class-teacher-only').forEach(el => {
                    el.style.display = 'block';
                });
            } else if (role === 'subjectTeacher') {
                document.querySelectorAll('.subject-teacher-only').forEach(el => {
                    el.style.display = 'block';
                });
            }
            
            // Update navigation tabs
            updateNavTabs(role);
        }

        function updateNavTabs(role) {
            const navTabs = document.querySelectorAll('.nav-tab');
            
            navTabs.forEach(tab => {
                const tabName = tab.getAttribute('data-tab');
                let showTab = false;
                
                if (role === 'principal') {
                    showTab = true;
                } else if (role === 'classTeacher') {
                    showTab = ['attendance', 'students', 'reports', 'grades', 'subjects'].includes(tabName);
                } else if (role === 'subjectTeacher') {
                    showTab = ['attendance', 'reports'].includes(tabName);
                }
                
                tab.style.display = showTab ? 'block' : 'none';
            });
            
            // Ensure at least one tab is active
            const activeTabs = document.querySelectorAll('.nav-tab.active');
            if (activeTabs.length === 0) {
                const firstVisibleTab = document.querySelector('.nav-tab[style="display: block;"], .nav-tab:not([style*="display: none"])');
                if (firstVisibleTab) {
                    firstVisibleTab.click();
                }
            }
        }

        function doLogout() {
            auth.signOut().then(() => {
                appData.currentUser = null;
                appData.userRole = null;
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('appContent').style.display = 'none';
            });
        }
