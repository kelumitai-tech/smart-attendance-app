        // ==== 0. Authentication & Roles ====

        async function handleAuthStateChanged(user) {
            loadingIndicator.style.display = 'none';
            currentUser = user;
            currentUserRole = null; // Reset role on auth change

            if (user) {
                console.log("User logged in:", user.uid, user.email);
                loginScreen.style.display = 'none';
                appContent.style.display = 'block';

                // Attempt to get user role (Example using Firestore document)
                try {
                    const userDocRef = db.collection('users').doc(user.uid);
                    const userDoc = await userDocRef.get();
                    if (userDoc.exists && userDoc.data().role) {
                        currentUserRole = userDoc.data().role; // e.g., 'principal' or 'teacher'
                        console.log("User role:", currentUserRole);
                    } else {
                        console.warn("User role not found in Firestore. Defaulting to 'teacher'.");
                         // If no role doc, maybe default or prevent access? Let's default to teacher for now.
                         // For production, you might want to force setup or show an error.
                        currentUserRole = 'teacher';
                         // Optional: Create the user doc if it doesn't exist
                         // await userDocRef.set({ email: user.email, role: 'teacher' }, { merge: true });
                    }
                } catch (error) {
                    console.error("Error fetching user role:", error);
                    currentUserRole = 'teacher'; // Fallback role on error
                    alert("Could not determine user role. Please try refreshing.");
                }

                updateUIForRole(); // Show/hide elements based on role

                if (!appState.isDataLoaded) {
                    loadInitialData();
                }
            } else {
                console.log("User logged out");
                loginScreen.style.display = 'block';
                appContent.style.display = 'none';
                clearUI();
                appState.isDataLoaded = false;
            }
        }

        function updateUIForRole() {
            if (!currentUserRole) return;

            appTitle.textContent = `Smart Attendance (${currentUserRole})`; // Example: Show role in title

            // Principal sees everything (except maybe adding students?)
            if (currentUserRole === 'principal') {
                dashboardCard.style.display = 'block';
                dangerZoneCard.style.display = 'block';
                 managementCards.forEach(card => card.style.display = 'block'); // Show all management cards
                 // Maybe hide student add card for principal?
                 // document.getElementById('student-manager-card').style.display = 'none';
            }
            // Teacher sees limited sections
            else { // Assuming 'teacher' role
                dashboardCard.style.display = 'none';
                dangerZoneCard.style.display = 'none';
                // Teachers might only need to select class/subject/teacher, not add them
                 managementCards.forEach(card => card.style.display = 'none'); // Hide all management cards by default
                 // Show only selection parts if needed, or keep them if teachers manage their own lists
                 document.getElementById('class-manager-card').style.display = 'block'; // Example: Teacher still selects class
                 document.getElementById('subject-manager-card').style.display = 'block'; // Example: Teacher still selects subject
                 document.getElementById('teacher-manager-card').style.display = 'block'; // Example: Teacher selects self
                 document.getElementById('student-manager-card').style.display = 'block'; // Example: Teacher adds students

                 // You might need more granular control based on exact requirements
            }
        }

        // MODIFIED: Clear Week with Confirmation
        async function clearWeekData() {
            // NEW: Confirmation Dialog
            if (!confirm("Are you sure you want to clear all currently displayed attendance marks for this week?\nThis action cannot be undone easily.")) {
                 return; // Stop if user clicks Cancel
            }

            if (!currentUser || !db) return;
            // ... (rest of the clearWeekData function is the same as previous) ...
             clearWeekBtn.disabled = true;
             const selectedClassId = selectClass.value;
             const selectedSubject = selectSubject.value;
             const selectedTeacher = selectTeacher.value;
             if (!selectedClassId || !selectedSubject || !selectedTeacher) { clearWeekBtn.disabled = false; return; }

             const headers = document.querySelectorAll('#attendanceTable thead th');
             const rows = document.querySelectorAll('#attendanceTable tr.student-row');

             const batch = db.batch();
             let operationsCount = 0;
             const datesProcessed = new Set();

             try {
                 rows.forEach(row => {
                     const studentName = row.cells[0].textContent;
                     const checkboxes = row.querySelectorAll('input[type="checkbox"]');
                     checkboxes.forEach((checkbox, index) => {
                         const date = headers[index + 1].dataset.date;
                         if (date) {
                             checkbox.checked = false;
                             updateAttendanceRecord(batch, selectedClassId, selectedSubject, selectedTeacher, date, studentName, false);
                             operationsCount++;
                             datesProcessed.add(date);
                         }
                     });
                 });


                 if (operationsCount > 0) {
                      await batch.commit();
                      calculateTotals();
                      alert("This week's marks cleared.");
                      console.log("Batch attendance clear successful.");
                 } else {
                      alert('No attendance data found for this week to clear.');
                 }
             } catch (error) {
                 console.error("Error clearing week data:", error);
                 alert("Error clearing attendance data. Check Firestore rules/connection.");
                 renderStudentTable();
             } finally {
                  clearWeekBtn.disabled = false;
             }
        }

        // NEW: Mark All Present Function
        function markAllPresent() {
             const rows = document.querySelectorAll('#attendanceTable tr.student-row');
             if (rows.length === 0) return; // No students to mark

             rows.forEach(row => {
                 const checkboxes = row.querySelectorAll('input[type="checkbox"]');
                 checkboxes.forEach(checkbox => {
                     checkbox.checked = true;
                 });
             });
             calculateTotals(); // Update totals after marking
        }

        // ==== 5. Initialization ====
        document.addEventListener('DOMContentLoaded', function() {

            loadingIndicator.style.display = 'block';
            loginScreen.style.display = 'none';
            appContent.style.display = 'none';

            if (typeof firebase === 'undefined' || !firebase.apps.length) {
                 console.error("Firebase is not loaded or initialized!");
                 loadingIndicator.textContent = "Error loading application resources. Please refresh.";
                 return;
            }

            // Listen for authentication state changes
            auth.onAuthStateChanged(handleAuthStateChanged);

            // Add Login/Logout button listeners
            loginBtn.addEventListener('click', loginUser);
            logoutBtn.addEventListener('click', logoutUser);
            googleLoginBtn.addEventListener('click', loginWithGoogle); // NEW

            // --- Other event listeners ---
            addClassBtn.addEventListener('click', addNewClass);
            addSubjectBtn.addEventListener('click', addNewSubject);
            addTeacherBtn.addEventListener('click', addNewTeacher);

            selectClass.addEventListener('change', handleClassChange);
            selectSubject.addEventListener('change', handleSubjectChange);

            calculateBtn.addEventListener('click', calculateTotals);
            clearWeekBtn.addEventListener('click', clearWeekData); // Now has confirmation

            generateReportBtn.addEventListener('click', generateMonthlyReport);
            printReportBtn.addEventListener('click', printReport);
            generateDashboardBtn.addEventListener('click', generateDashboard);

            resetAllBtn.addEventListener('click', resetAllData);

        });
