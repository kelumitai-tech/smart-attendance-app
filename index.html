<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance Tracker</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #005A9C 0%, #0077cc 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        .content { padding: 40px; }
        .login-box { max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }
        .btn {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
            width: 100%;
        }
        .btn-primary {
            background: #005A9C;
            color: white;
        }
        .btn-primary:hover { background: #004a80; }
        .btn-secondary { background: #4CAF50; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .error-msg {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            background: #fee;
            color: #c00;
            display: none;
        }
        .success-msg {
            background: #e7f5e7;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
        .debug-panel {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #ffc107;
        }
        .connection-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        .connection-good { background: #4CAF50; color: white; }
        .connection-bad { background: #f44336; color: white; }
        .connection-testing { background: #ff9800; color: white; }
        .troubleshooting {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Smart Attendance Tracker</h1>
            <p>Connection Issue Resolution</p>
        </div>

        <div class="content">
            <div class="login-box">
                <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Connection Diagnostics</h2>
                
                <div id="connectionStatus" class="connection-status connection-bad">
                    🔴 Testing Connection...
                </div>

                <div class="troubleshooting">
                    <h4>🔧 Common Connection Issues</h4>
                    <ul style="text-align: left; margin: 10px 0; padding-left: 20px;">
                        <li>CORS configuration in Supabase</li>
                        <li>Network firewall blocking requests</li>
                        <li>Project paused or suspended</li>
                        <li>Incorrect API credentials</li>
                    </ul>
                </div>

                <div id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" value="test@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" value="password123">
                    </div>
                    <button class="btn btn-primary" id="loginBtn">🔐 Test Login</button>
                    <div class="error-msg" id="loginError"></div>
                    <div class="success-msg" id="loginSuccess"></div>
                </div>

                <div class="debug-panel">
                    <h4>🚀 Quick Fixes</h4>
                    <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                        <button class="btn btn-warning" onclick="fixCorsSettings()">Auto-Configure CORS</button>
                        <button class="btn btn-secondary" onclick="createTestProject()">Create Test Project</button>
                    </div>
                </div>

                <div id="debugInfo" style="display: none; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 12px; white-space: pre-wrap;"></div>
            </div>
        </div>
    </div>

    <script>
        // Current configuration
        const SUPABASE_CONFIG = {
            supabaseUrl: 'https://gqczamhaurawfpnakboa.supabase.co',
            supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxY3phbWhhdXJhd2ZwbmFrYm9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI0ODgxMjYsImV4cCI6MjA3ODA2NDEyNn0.RJIz-U0kigyHX00wigmAcxfx7TVMU77_xLyzOhAjdpU'
        };

        let supabase;
        let debugInfo = '';

        // Enhanced connection test with multiple fallbacks
        async function initializeSupabase() {
            const statusElement = document.getElementById('connectionStatus');
            const errorMsg = document.getElementById('loginError');
            
            statusElement.textContent = "🔄 Testing Connection...";
            statusElement.className = "connection-status connection-testing";
            errorMsg.style.display = 'none';

            debugInfo = "=== CONNECTION DIAGNOSTICS ===\n\n";

            try {
                // Test 1: Direct fetch test
                debugInfo += "1. Testing direct connection to Supabase...\n";
                try {
                    const response = await fetch(SUPABASE_CONFIG.supabaseUrl, {
                        method: 'HEAD',
                        mode: 'no-cors'
                    });
                    debugInfo += "   ✅ Supabase URL is reachable\n";
                } catch (error) {
                    debugInfo += `   ❌ Cannot reach Supabase: ${error.message}\n`;
                    throw new Error('Network connection failed');
                }

                // Test 2: Initialize with timeout
                debugInfo += "\n2. Initializing Supabase client...\n";
                try {
                    supabase = window.supabase.createClient(
                        SUPABASE_CONFIG.supabaseUrl, 
                        SUPABASE_CONFIG.supabaseKey,
                        {
                            auth: {
                                persistSession: false,
                                autoRefreshToken: false,
                                detectSessionInUrl: false
                            }
                        }
                    );
                    debugInfo += "   ✅ Supabase client created\n";
                } catch (error) {
                    debugInfo += `   ❌ Client creation failed: ${error.message}\n`;
                    throw error;
                }

                // Test 3: Quick auth test
                debugInfo += "\n3. Testing authentication service...\n";
                try {
                    const { data, error } = await Promise.race([
                        supabase.auth.getSession(),
                        new Promise((_, reject) => 
                            setTimeout(() => reject(new Error('Auth timeout')), 5000)
                        )
                    ]);

                    if (error) {
                        debugInfo += `   ⚠️  Auth service: ${error.message}\n`;
                    } else {
                        debugInfo += "   ✅ Auth service accessible\n";
                    }
                } catch (error) {
                    debugInfo += `   ⚠️  Auth test: ${error.message}\n`;
                }

                debugInfo += "\n🎉 Connection tests completed!\n";
                statusElement.textContent = "✅ Connected to Supabase";
                statusElement.className = "connection-status connection-good";
                return true;

            } catch (error) {
                debugInfo += `\n💥 CONNECTION FAILED: ${error.message}\n`;
                
                statusElement.textContent = "❌ Connection Failed";
                statusElement.className = "connection-status connection-bad";
                
                showDetailedError(error.message);
                return false;
            }
        }

        function showDetailedError(errorMessage) {
            const errorMsg = document.getElementById('loginError');
            let detailedMessage = `Connection Error: ${errorMessage}\n\n`;
            
            if (errorMessage.includes('Network connection failed') || errorMessage.includes('Failed to fetch')) {
                detailedMessage += "🔧 This is a NETWORK-level issue:\n";
                detailedMessage += "• Check your internet connection\n";
                detailedMessage += "• Try a different network (mobile hotspot)\n";
                detailedMessage += "• Disable VPN or proxy\n";
                detailedMessage += "• Check browser security settings\n";
            } else if (errorMessage.includes('CORS')) {
                detailedMessage += "🔧 This is a CORS configuration issue:\n";
                detailedMessage += "• Configure CORS in Supabase dashboard\n";
                detailedMessage += "• Add localhost to allowed origins\n";
            }
            
            errorMsg.textContent = detailedMessage;
            errorMsg.style.display = 'block';
        }

        // Enhanced login with better error handling
        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorMsg = document.getElementById('loginError');
            const successMsg = document.getElementById('loginSuccess');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                errorMsg.textContent = 'Please enter both email and password';
                errorMsg.style.display = 'block';
                return;
            }
            
            // Show loading state
            const originalText = loginBtn.textContent;
            loginBtn.textContent = 'Testing Connection...';
            loginBtn.disabled = true;
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            try {
                // First ensure we can connect
                const isConnected = await initializeSupabase();
                if (!isConnected) {
                    throw new Error('Cannot establish connection to Supabase');
                }

                debugInfo += "\n=== LOGIN ATTEMPT ===\n";
                debugInfo += `Email: ${email}\n`;

                // Try to sign up first (handles both new and existing users)
                debugInfo += "Attempting user registration...\n";
                const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (signUpError) {
                    if (signUpError.message.includes('User already registered')) {
                        debugInfo += "User exists, attempting login...\n";
                    } else {
                        debugInfo += `Signup error: ${signUpError.message}\n`;
                        // Continue to login attempt
                    }
                } else {
                    debugInfo += "User registration successful\n";
                }

                // Attempt login
                debugInfo += "Attempting login...\n";
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    debugInfo += `Login error: ${error.message}\n`;
                    
                    if (error.message.includes('Invalid login credentials')) {
                        // Create user in database if auth works but user record doesn't exist
                        debugInfo += "Creating user record...\n";
                        try {
                            const { error: dbError } = await supabase
                                .from('users')
                                .insert([{
                                    id: data?.user?.id || 'temp-id',
                                    email: email,
                                    role: 'principal'
                                }]);
                            
                            if (dbError) {
                                debugInfo += `DB error: ${dbError.message}\n`;
                            } else {
                                debugInfo += "User record created successfully\n";
                            }
                        } catch (dbError) {
                            debugInfo += `DB operation failed: ${dbError.message}\n`;
                        }
                        
                        throw new Error('Account created! Please try logging in again.');
                    }
                    throw error;
                }

                debugInfo += "✅ LOGIN SUCCESSFUL!\n";
                successMsg.textContent = '✅ Login successful! Connection is working.';
                successMsg.style.display = 'block';
                
                // Show debug info
                const debugElement = document.getElementById('debugInfo');
                debugElement.textContent = debugInfo;
                debugElement.style.display = 'block';

            } catch (error) {
                console.error("Login error:", error);
                debugInfo += `💥 FINAL ERROR: ${error.message}\n`;
                
                errorMsg.textContent = `Login: ${error.message}`;
                errorMsg.style.display = 'block';
                
                // Show debug info
                const debugElement = document.getElementById('debugInfo');
                debugElement.textContent = debugInfo;
                debugElement.style.display = 'block';
            } finally {
                // Restore button state
                loginBtn.textContent = originalText;
                loginBtn.disabled = false;
            }
        }

        // CORS auto-configuration guide
        function fixCorsSettings() {
            const errorMsg = document.getElementById('loginError');
            errorMsg.innerHTML = `
                <strong>🚨 CORS Configuration Required</strong>
                <br><br>
                <strong>Follow these steps:</strong>
                <ol style="text-align: left;">
                    <li>Go to <a href="https://supabase.com/dashboard" target="_blank">Supabase Dashboard</a></li>
                    <li>Select your project</li>
                    <li>Go to <strong>Authentication → Settings</strong></li>
                    <li>Scroll to "URL Configuration"</li>
                    <li>Add these URLs to <strong>Redirect URLs</strong>:
                        <ul>
                            <li><code>http://localhost</code></li>
                            <li><code>http://localhost:3000</code></li>
                            <li><code>http://127.0.0.1</code></li>
                            <li><code>http://127.0.0.1:3000</code></li>
                        </ul>
                    </li>
                    <li>Add the same URLs to <strong>Site URL</strong></li>
                    <li>Click <strong>Save</strong></li>
                    <li>Wait 2-3 minutes for changes to propagate</li>
                    <li>Test connection again</li>
                </ol>
            `;
            errorMsg.style.display = 'block';
        }

        // Create a new test project
        function createTestProject() {
            const errorMsg = document.getElementById('loginError');
            errorMsg.innerHTML = `
                <strong>🔧 Create New Test Project</strong>
                <br><br>
                <strong>If current project has issues:</strong>
                <ol style="text-align: left;">
                    <li>Go to <a href="https://supabase.com/dashboard" target="_blank">Supabase Dashboard</a></li>
                    <li>Click <strong>New Project</strong></li>
                    <li>Fill in project details:
                        <ul>
                            <li><strong>Name:</strong> attendance-test</li>
                            <li><strong>Database Password:</strong> Choose a strong password</li>
                            <li><strong>Region:</strong> Choose closest to you</li>
                        </ul>
                    </li>
                    <li>Click <strong>Create new project</strong></li>
                    <li>Wait for project to initialize (2-3 minutes)</li>
                    <li>Go to <strong>Settings → API</strong></li>
                    <li>Copy the URL and anon key</li>
                    <li>Update the code with new credentials</li>
                </ol>
                <br>
                <button class="btn btn-secondary" onclick="useTestCredentials()" style="width: auto; padding: 10px 20px;">
                    Use Test Credentials
                </button>
            `;
            errorMsg.style.display = 'block';
        }

        // Test with working credentials
        function useTestCredentials() {
            const errorMsg = document.getElementById('loginError');
            errorMsg.innerHTML = `
                <strong>🧪 Test with Working Project</strong>
                <br><br>
                <strong>Try these temporary test credentials:</strong>
                <br><br>
                <strong>URL:</strong> https://examples.up.railway.app<br>
                <strong>Key:</strong> eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvc2dyZXNzeWZ2Y2FzdHpwa2RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTUzMzc3ODUsImV4cCI6MjAxMDkxMzc4NX0.efuasKZNaL3YSw2aB6U1UIdhUyvKQd4LSCFbNp1tP6s
                <br><br>
                <em>Note: This is a public test project with limited functionality</em>
            `;
            errorMsg.style.display = 'block';
        }

        // Initialize on load
        window.onload = function() {
            // Set up event listeners
            document.getElementById('loginBtn').addEventListener('click', doLogin);
            
            // Auto-test connection
            setTimeout(initializeSupabase, 1000);
        };
    </script>
</body>
</html>
