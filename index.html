<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        .header {
            background: #005A9C;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #005A9C;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background: #004a80; }
        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
        .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
        .toggle-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .toggle-link a {
            color: #005A9C;
            text-decoration: none;
            font-weight: bold;
        }
        .logout-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Smart Attendance Tracker</h1>
            <p>සිසුන්ගේ ගැනුම්-දැනුම් පද්ධතිය</p>
        </div>
        
        <div class="content">
            <!-- Login Form -->
            <div id="loginForm">
                <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Login</h2>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" value="test@example.com">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" value="password123">
                </div>
                
                <div class="form-group">
                    <label>Login As</label>
                    <select id="loginRole">
                        <option value="principal">Principal</option>
                        <option value="classTeacher">Class Teacher</option>
                        <option value="subjectTeacher" selected>Subject Teacher</option>
                    </select>
                </div>
                
                <button class="btn" id="loginBtn">Login</button>
                
                <div class="error-msg" id="loginError"></div>
                <div class="success-msg" id="loginSuccess"></div>
                
                <div class="toggle-link">
                    Don't have an account? <a href="#" id="showRegister">Register</a>
                </div>
            </div>
            
            <!-- Registration Form -->
            <div id="registerForm" style="display: none;">
                <h2 style="text-align: center; margin-bottom: 20px; color: #333;">Register</h2>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="registerEmail" placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="Enter password (min 6 chars)">
                </div>
                
                <div class="form-group">
                    <label>Role</label>
                    <select id="registerRole">
                        <option value="subjectTeacher">Subject Teacher</option>
                    </select>
                </div>
                
                <button class="btn" id="registerBtn">Register</button>
                
                <div class="error-msg" id="registerError"></div>
                <div class="success-msg" id="registerSuccess"></div>
                
                <div class="toggle-link">
                    Already have an account? <a href="#" id="showLogin">Login</a>
                </div>
            </div>
            
            <!-- App Content (hidden initially) -->
            <div id="appContent" style="display: none;">
                <h2 style="text-align: center; color: #005A9C;">Welcome!</h2>
                <p style="text-align: center; margin: 20px 0;">You are logged in successfully.</p>
                
                <div style="background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 20px 0;">
                    <p><strong>User Email:</strong> <span id="userEmail"></span></p>
                    <p><strong>User Role:</strong> <span id="userRole"></span></p>
                </div>
                
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
    </div>

    <script>
        // ====================
        // SUPABASE CONFIGURATION
        // ====================
        // ඔබගේ Supabase project details මෙහි දමන්න
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE'; // Example: https://abcdefghijklmnop.supabase.co
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE'; // Example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        
        // Initialize Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        console.log('Supabase initialized:', supabase ? 'Success' : 'Failed');
        
        // ====================
        // EVENT LISTENERS
        // ====================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            
            // Login/Register toggle
            document.getElementById('showRegister').addEventListener('click', function(e) {
                e.preventDefault();
                showRegisterForm();
            });
            
            document.getElementById('showLogin').addEventListener('click', function(e) {
                e.preventDefault();
                showLoginForm();
            });
            
            // Login button
            document.getElementById('loginBtn').addEventListener('click', login);
            
            // Register button
            document.getElementById('registerBtn').addEventListener('click', register);
            
            // Logout button
            document.getElementById('logoutBtn').addEventListener('click', logout);
            
            // Check if user is already logged in
            checkSession();
        });
        
        // ====================
        // FUNCTIONS
        // ====================
        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            clearMessages();
        }
        
        function showLoginForm() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            clearMessages();
        }
        
        function clearMessages() {
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginSuccess').style.display = 'none';
            document.getElementById('registerError').style.display = 'none';
            document.getElementById('registerSuccess').style.display = 'none';
        }
        
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            
            // Hide after 5 seconds
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            
            // Hide after 5 seconds
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }
        
        async function checkSession() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error) {
                    console.error('Session error:', error);
                    return;
                }
                
                if (session && session.user) {
                    console.log('User already logged in:', session.user.email);
                    showApp(session.user);
                }
            } catch (error) {
                console.error('Check session error:', error);
            }
        }
        
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;
            
            if (!email || !password) {
                showError('loginError', 'Please enter email and password');
                return;
            }
            
            try {
                console.log('Attempting login...');
                
                // First, sign out any existing session
                await supabase.auth.signOut();
                
                // Attempt login
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    console.error('Login error:', error);
                    
                    // If user doesn't exist, try to sign up
                    if (error.message.includes('Invalid login credentials')) {
                        showError('loginError', 'Invalid credentials. Trying to register...');
                        
                        // Try to register
                        const { data: signupData, error: signupError } = await supabase.auth.signUp({
                            email: email,
                            password: password
                        });
                        
                        if (signupError) {
                            showError('loginError', 'Registration failed: ' + signupError.message);
                            return;
                        }
                        
                        if (signupData.user) {
                            // Create user record in users table
                            await createUserRecord(signupData.user.id, email, role);
                            
                            // Auto login
                            const { data: loginData, error: loginError2 } = await supabase.auth.signInWithPassword({
                                email: email,
                                password: password
                            });
                            
                            if (loginError2) {
                                showError('loginError', 'Auto-login failed. Please try logging in.');
                                return;
                            }
                            
                            showApp(loginData.user);
                            showSuccess('loginSuccess', 'Account created and logged in successfully!');
                        }
                    } else {
                        showError('loginError', 'Login failed: ' + error.message);
                    }
                    return;
                }
                
                // Login successful
                console.log('Login successful:', data.user.email);
                
                // Check if user exists in users table
                const { data: userData, error: userError } = await supabase
                    .from('users')
                    .select('*')
                    .eq('email', email)
                    .single();
                
                if (userError) {
                    // User doesn't exist in users table, create record
                    await createUserRecord(data.user.id, email, role);
                }
                
                showApp(data.user);
                showSuccess('loginSuccess', 'Login successful!');
                
            } catch (error) {
                console.error('Login catch error:', error);
                showError('loginError', 'An error occurred: ' + error.message);
            }
        }
        
        async function createUserRecord(userId, email, role) {
            try {
                const { error } = await supabase
                    .from('users')
                    .insert([
                        {
                            id: userId,
                            email: email,
                            role: role
                        }
                    ]);
                
                if (error) {
                    console.error('Error creating user record:', error);
                } else {
                    console.log('User record created successfully');
                }
            } catch (error) {
                console.error('Create user record error:', error);
            }
        }
        
        async function register() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const role = document.getElementById('registerRole').value;
            
            if (!email || !password) {
                showError('registerError', 'Please enter email and password');
                return;
            }
            
            if (password.length < 6) {
                showError('registerError', 'Password must be at least 6 characters');
                return;
            }
            
            try {
                console.log('Attempting registration...');
                
                // Sign up with Supabase Auth
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });
                
                if (error) {
                    console.error('Registration error:', error);
                    showError('registerError', 'Registration failed: ' + error.message);
                    return;
                }
                
                if (data.user) {
                    // Create user record in users table
                    await createUserRecord(data.user.id, email, role);
                    
                    showSuccess('registerSuccess', 'Registration successful! You can now login.');
                    showLoginForm();
                } else {
                    showSuccess('registerSuccess', 'Registration initiated. Please check your email.');
                }
                
            } catch (error) {
                console.error('Register catch error:', error);
                showError('registerError', 'An error occurred: ' + error.message);
            }
        }
        
        function showApp(user) {
            // Hide login/register forms
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            
            // Show app content
            document.getElementById('appContent').style.display = 'block';
            
            // Display user info
            document.getElementById('userEmail').textContent = user.email;
            
            // Try to get user role
            getUserRole(user.email);
        }
        
        async function getUserRole(email) {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('role')
                    .eq('email', email)
                    .single();
                
                if (!error && data) {
                    document.getElementById('userRole').textContent = data.role;
                } else {
                    document.getElementById('userRole').textContent = 'Subject Teacher';
                }
            } catch (error) {
                console.error('Get user role error:', error);
                document.getElementById('userRole').textContent = 'Subject Teacher';
            }
        }
        
        async function logout() {
            try {
                const { error } = await supabase.auth.signOut();
                
                if (error) {
                    console.error('Logout error:', error);
                } else {
                    // Hide app content
                    document.getElementById('appContent').style.display = 'none';
                    
                    // Show login form
                    showLoginForm();
                    
                    // Clear form fields
                    document.getElementById('loginEmail').value = '';
                    document.getElementById('loginPassword').value = '';
                    
                    console.log('Logged out successfully');
                }
            } catch (error) {
                console.error('Logout catch error:', error);
            }
        }
        
        // Listen for auth state changes
        supabase.auth.onAuthStateChange((event, session) => {
            console.log('Auth state changed:', event);
            
            if (event === 'SIGNED_IN' && session) {
                console.log('User signed in:', session.user.email);
                showApp(session.user);
            } else if (event === 'SIGNED_OUT') {
                console.log('User signed out');
                document.getElementById('appContent').style.display = 'none';
                showLoginForm();
            }
        });
        
        // Debug function
        window.testSupabase = async function() {
            console.log('Testing Supabase connection...');
            
            try {
                // Test 1: Check auth
                const { data: authData, error: authError } = await supabase.auth.getSession();
                console.log('Auth test:', authError ? 'Failed: ' + authError.message : 'Success');
                
                // Test 2: Check database
                const { data: dbData, error: dbError } = await supabase
                    .from('subjects')
                    .select('count')
                    .limit(1);
                    
                console.log('Database test:', dbError ? 'Failed: ' + dbError.message : 'Success');
                
                // Test 3: List tables
                const { data: tables, error: tablesError } = await supabase
                    .from('subjects')
                    .select('*')
                    .limit(5);
                    
                console.log('Tables test:', tablesError ? 'Failed: ' + tablesError.message : 'Success', tables);
                
            } catch (error) {
                console.error('Test error:', error);
            }
        };
        
        // Run test on load
        setTimeout(() => {
            window.testSupabase();
        }, 1000);
    </script>
</body>
</html>
