<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance Tracker</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        /* ... (all your existing CSS styles remain the same) ... */
    </style>
</head>
<body>
    <!-- ... (all your existing HTML structure remains the same) ... -->

    <script>
        // ... (all your existing Firebase configuration and setup code remains the same) ...

        // Report Functions - FIXED VERSION
        async function generateReport() {
            const classId = document.getElementById('reportClass').value;
            const subjectId = document.getElementById('reportSubject').value;
            const month = document.getElementById('reportMonth').value;
            
            if (!classId || !subjectId || !month) {
                alert('Please select class, subject, and month');
                return;
            }
            
            try {
                // Get class info
                const classDoc = await db.collection('grades').doc(classId).get();
                const classInfo = classDoc.exists ? classDoc.data() : { grade: 'Unknown', className: 'Unknown' };
                
                // Get subject info
                const subjectDoc = await db.collection('subjects').doc(subjectId).get();
                const subjectName = subjectDoc.exists ? subjectDoc.data().name : 'Unknown';
                
                // Get students for the class
                const studentsSnapshot = await db.collection('students')
                    .where('gradeId', '==', classId)
                    .get();
                
                if (studentsSnapshot.empty) {
                    alert('No students found for the selected class');
                    return;
                }
                
                // Get attendance for the month
                const startDate = `${month}-01`;
                const endDate = `${month}-31`;
                
                const attendanceSnapshot = await db.collection('attendance')
                    .where('classId', '==', classId)
                    .where('subjectId', '==', subjectId)
                    .where('date', '>=', startDate)
                    .where('date', '<=', endDate)
                    .get();
                
                // Process attendance data
                const studentAttendance = {};
                studentsSnapshot.forEach(doc => {
                    const student = doc.data();
                    studentAttendance[student.studentId] = {
                        name: student.name,
                        present: 0,
                        total: 0,
                        percentage: 0
                    };
                });
                
                attendanceSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (studentAttendance[data.studentId]) {
                        studentAttendance[data.studentId].total++;
                        if (data.status === 'present') {
                            studentAttendance[data.studentId].present++;
                        }
                    }
                });
                
                // Calculate percentages
                Object.keys(studentAttendance).forEach(studentId => {
                    const data = studentAttendance[studentId];
                    data.percentage = data.total > 0 ? Math.round((data.present / data.total) * 100) : 0;
                });
                
                // Store data for PDF generation
                appData.currentReportData = {
                    classInfo,
                    subjectName,
                    month,
                    studentAttendance
                };
                
                // Generate report HTML
                let reportHTML = `
                    <div class="card">
                        <h3>Monthly Attendance Report</h3>
                        <p><strong>Class:</strong> ${classInfo.grade} - ${classInfo.className}</p>
                        <p><strong>Subject:</strong> ${subjectName}</p>
                        <p><strong>Month:</strong> ${month}</p>
                        
                        <table id="reportTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Student ID</th>
                                    <th>Name</th>
                                    <th>Present</th>
                                    <th>Total</th>
                                    <th>Percentage</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                let index = 1;
                Object.keys(studentAttendance).forEach(studentId => {
                    const data = studentAttendance[studentId];
                    const percentageClass = data.percentage >= 80 ? 'percentage-good' : 
                                           data.percentage >= 60 ? 'percentage-average' : 'percentage-poor';
                    
                    reportHTML += `
                        <tr>
                            <td>${index}</td>
                            <td>${studentId}</td>
                            <td>${data.name}</td>
                            <td>${data.present}</td>
                            <td>${data.total}</td>
                            <td class="${percentageClass}">${data.percentage}%</td>
                        </tr>
                    `;
                    index++;
                });
                
                // Add summary row
                const totalStudents = Object.keys(studentAttendance).length;
                const totalPresent = Object.values(studentAttendance).reduce((sum, data) => sum + data.present, 0);
                const totalDays = Object.values(studentAttendance).reduce((sum, data) => sum + data.total, 0);
                const overallPercentage = totalDays > 0 ? Math.round((totalPresent / totalDays) * 100) : 0;
                
                reportHTML += `
                            </tbody>
                            <tfoot>
                                <tr style="background-color: #f5f5f5; font-weight: bold;">
                                    <td colspan="3">Summary</td>
                                    <td>${totalPresent}</td>
                                    <td>${totalDays}</td>
                                    <td>${overallPercentage}%</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                `;
                
                document.getElementById('reportOutput').innerHTML = reportHTML;
                
            } catch (error) {
                console.error("Error generating report:", error);
                alert('Error generating report: ' + error.message);
            }
        }

        // FIXED PDF Generation Function
        function generatePdfReport() {
            // Check if report data exists
            if (!appData.currentReportData) {
                alert('Please generate a report first before creating PDF');
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                const reportData = appData.currentReportData;
                const { classInfo, subjectName, month, studentAttendance } = reportData;
                
                // PDF Styling
                const pageWidth = doc.internal.pageSize.width;
                const margin = 20;
                const contentWidth = pageWidth - (2 * margin);
                
                // Title
                doc.setFontSize(18);
                doc.setFont(undefined, 'bold');
                doc.text('Monthly Attendance Report', margin, 20);
                
                // Report Details
                doc.setFontSize(12);
                doc.setFont(undefined, 'normal');
                doc.text(`Class: ${classInfo.grade} - ${classInfo.className}`, margin, 35);
                doc.text(`Subject: ${subjectName}`, margin, 45);
                doc.text(`Month: ${month}`, margin, 55);
                
                // Prepare table data
                const tableData = [];
                let index = 1;
                
                Object.keys(studentAttendance).forEach(studentId => {
                    const data = studentAttendance[studentId];
                    tableData.push([
                        index.toString(),
                        studentId,
                        data.name,
                        data.present.toString(),
                        data.total.toString(),
                        data.percentage + '%'
                    ]);
                    index++;
                });
                
                // Add summary row
                const totalStudents = Object.keys(studentAttendance).length;
                const totalPresent = Object.values(studentAttendance).reduce((sum, data) => sum + data.present, 0);
                const totalDays = Object.values(studentAttendance).reduce((sum, data) => sum + data.total, 0);
                const overallPercentage = totalDays > 0 ? Math.round((totalPresent / totalDays) * 100) : 0;
                
                tableData.push([
                    '',
                    'SUMMARY',
                    '',
                    totalPresent.toString(),
                    totalDays.toString(),
                    overallPercentage + '%'
                ]);
                
                // Generate table
                doc.autoTable({
                    startY: 65,
                    head: [['#', 'Student ID', 'Name', 'Present', 'Total', 'Percentage']],
                    body: tableData,
                    theme: 'grid',
                    styles: { fontSize: 10, cellPadding: 3 },
                    headStyles: { fillColor: [0, 90, 156], textColor: 255, fontStyle: 'bold' },
                    alternateRowStyles: { fillColor: [240, 240, 240] },
                    margin: { top: 65 },
                    didDrawPage: function (data) {
                        // Footer
                        doc.setFontSize(10);
                        doc.setTextColor(100);
                        doc.text(
                            `Generated on ${new Date().toLocaleDateString()} - Smart Attendance Tracker`,
                            margin,
                            doc.internal.pageSize.height - 10
                        );
                    }
                });
                
                // Save PDF
                const fileName = `attendance_report_${classInfo.grade}_${classInfo.className}_${subjectName}_${month}.pdf`;
                doc.save(fileName);
                
            } catch (error) {
                console.error("Error generating PDF:", error);
                alert('Error generating PDF: ' + error.message);
                
                // Fallback: Try simple PDF generation without autoTable
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    doc.setFontSize(16);
                    doc.text('Attendance Report - PDF Generation Error', 20, 20);
                    doc.setFontSize(12);
                    doc.text('There was an error generating the detailed PDF report.', 20, 40);
                    doc.text('Please try again or contact support.', 20, 50);
                    
                    doc.save('attendance_report_error.pdf');
                } catch (fallbackError) {
                    console.error("Fallback PDF generation also failed:", fallbackError);
                    alert('PDF generation failed completely. Please check the browser console for details.');
                }
            }
        }

        // Alternative PDF Generation Function (Simpler Version)
        function generateSimplePdfReport() {
            if (!appData.currentReportData) {
                alert('Please generate a report first before creating PDF');
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const margin = 20;
                let yPosition = 20;
                
                const reportData = appData.currentReportData;
                const { classInfo, subjectName, month, studentAttendance } = reportData;
                
                // Title
                doc.setFontSize(16);
                doc.setFont(undefined, 'bold');
                doc.text('Monthly Attendance Report', margin, yPosition);
                yPosition += 15;
                
                // Report Details
                doc.setFontSize(12);
                doc.setFont(undefined, 'normal');
                doc.text(`Class: ${classInfo.grade} - ${classInfo.className}`, margin, yPosition);
                yPosition += 8;
                doc.text(`Subject: ${subjectName}`, margin, yPosition);
                yPosition += 8;
                doc.text(`Month: ${month}`, margin, yPosition);
                yPosition += 15;
                
                // Table Header
                doc.setFont(undefined, 'bold');
                doc.text('#', margin, yPosition);
                doc.text('Student ID', margin + 15, yPosition);
                doc.text('Name', margin + 60, yPosition);
                doc.text('Present', margin + 120, yPosition);
                doc.text('Total', margin + 140, yPosition);
                doc.text('%', margin + 160, yPosition);
                yPosition += 8;
                
                // Horizontal line
                doc.line(margin, yPosition, margin + 180, yPosition);
                yPosition += 5;
                
                // Table Rows
                doc.setFont(undefined, 'normal');
                let index = 1;
                
                Object.keys(studentAttendance).forEach(studentId => {
                    if (yPosition > 270) { // Check if we need a new page
                        doc.addPage();
                        yPosition = 20;
                    }
                    
                    const data = studentAttendance[studentId];
                    doc.text(index.toString(), margin, yPosition);
                    doc.text(studentId, margin + 15, yPosition);
                    
                    // Truncate long names
                    const displayName = data.name.length > 20 ? data.name.substring(0, 17) + '...' : data.name;
                    doc.text(displayName, margin + 60, yPosition);
                    doc.text(data.present.toString(), margin + 120, yPosition);
                    doc.text(data.total.toString(), margin + 140, yPosition);
                    doc.text(data.percentage + '%', margin + 160, yPosition);
                    
                    yPosition += 8;
                    index++;
                });
                
                // Summary
                yPosition += 5;
                doc.line(margin, yPosition, margin + 180, yPosition);
                yPosition += 8;
                
                const totalStudents = Object.keys(studentAttendance).length;
                const totalPresent = Object.values(studentAttendance).reduce((sum, data) => sum + data.present, 0);
                const totalDays = Object.values(studentAttendance).reduce((sum, data) => sum + data.total, 0);
                const overallPercentage = totalDays > 0 ? Math.round((totalPresent / totalDays) * 100) : 0;
                
                doc.setFont(undefined, 'bold');
                doc.text('SUMMARY', margin, yPosition);
                doc.text(totalPresent.toString(), margin + 120, yPosition);
                doc.text(totalDays.toString(), margin + 140, yPosition);
                doc.text(overallPercentage + '%', margin + 160, yPosition);
                
                // Footer
                yPosition = doc.internal.pageSize.height - 10;
                doc.setFontSize(8);
                doc.setFont(undefined, 'normal');
                doc.text(`Generated on ${new Date().toLocaleDateString()} - Smart Attendance Tracker`, margin, yPosition);
                
                // Save PDF
                const fileName = `attendance_report_${classInfo.grade}_${classInfo.className}_${subjectName}_${month}.pdf`;
                doc.save(fileName);
                
            } catch (error) {
                console.error("Error in simple PDF generation:", error);
                alert('PDF generation failed: ' + error.message);
            }
        }

        // Update the event listener to use the simple version as fallback
        document.getElementById('generatePdfBtn').addEventListener('click', function() {
            // Try the enhanced version first, fall back to simple version if it fails
            generatePdfReport();
        });

        // ... (rest of your existing JavaScript code remains the same) ...
    </script>
</body>
</html>
