<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance Tracker</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #005A9C 0%, #0077cc 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        .header h1 { font-size: 2em; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 0.9em; }
        .role-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            border: 2px solid white;
        }
        .content { padding: 40px; }
        .login-box { max-width: 400px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #005A9C;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: #005A9C;
            color: white;
        }
        .btn-primary:hover {
            background: #004a80;
            transform: translateY(-2px);
        }
        .btn-google {
            background: #DB4437;
            color: white;
        }
        .btn-google:hover {
            background: #c23321;
        }
        .btn-secondary { background: #4CAF50; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .error-msg, .success-msg {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }
        .error-msg {
            background: #fee;
            color: #c00;
            display: none;
        }
        .success-msg {
            background: #e7f5e7;
            color: #2e7d32;
            display: none;
        }
        .app-main { display: none; }
        .nav-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .nav-tab {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
        }
        .nav-tab.active {
            color: #005A9C;
            border-bottom-color: #005A9C;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .card h3 {
            color: #005A9C;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background: #005A9C;
            color: white;
        }
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 20px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .logout-btn:hover {
            background: white;
            color: #005A9C;
        }
        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            color: #1565c0;
            margin-bottom: 20px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }
        .stats-card h2 { font-size: 3em; margin: 10px 0; }
        .principal-only { display: none; }
        .filter-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        .attendance-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .student-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #005A9C;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Smart Attendance Tracker</h1>
            <p>Efficient Student Attendance Management System</p>
        </div>

        <!-- Login Screen -->
        <div class="content" id="loginScreen">
            <div class="login-box">
                <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Welcome Back</h2>
                <div class="form-group">
                    <label>Login As</label>
                    <select id="loginRole">
                        <option value="teacher">Teacher</option>
                        <option value="principal">Principal (Admin)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button class="btn btn-primary" id="loginBtn">🔐 Login</button>
                <button class="btn btn-google" id="googleBtn">🌐 Sign in with Google</button>
                <div class="error-msg" id="loginError"></div>
                
                <!-- Registration Section -->
                <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
                    <h3 style="text-align: center; margin-bottom: 15px; color: #333;">New User?</h3>
                    <button class="btn btn-secondary" id="registerBtn">📝 Register New Account</button>
                </div>
            </div>
        </div>

        <!-- Main App (Initially Hidden) -->
        <div class="content app-main" id="appContent" style="display: none;">
            <button class="logout-btn" id="logoutBtn">Logout</button>
            <div class="role-badge" id="roleBadge">Teacher</div>
            
            <div class="nav-tabs" id="navTabs">
                <button class="nav-tab active" data-tab="attendance">📋 Attendance</button>
                <button class="nav-tab" data-tab="students">👥 Students</button>
                <button class="nav-tab" data-tab="reports">📊 Reports</button>
                <button class="nav-tab principal-only" data-tab="dashboard">🎯 Dashboard</button>
            </div>

            <!-- Simple Dashboard for Testing -->
            <div class="tab-content active" id="attendance">
                <div class="card">
                    <h3>Welcome to Smart Attendance Tracker</h3>
                    <div class="info-box" id="connectionStatus">
                        🔄 Checking Firebase connection...
                    </div>
                    <div class="form-group">
                        <label>Test Email</label>
                        <input type="email" id="testEmail" value="test@school.com" readonly>
                    </div>
                    <div class="form-group">
                        <label>Test Password</label>
                        <input type="password" id="testPassword" value="password123" readonly>
                    </div>
                    <button class="btn btn-primary" id="testRegisterBtn">Test Registration</button>
                    <button class="btn btn-secondary" id="testLoginBtn">Test Login</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCPPqnPEfVLkc7K29YPV7GDkIaC6tcHn4E",
            authDomain: "smart-attendance-tracker-5573b.firebaseapp.com",
            projectId: "smart-attendance-tracker-5573b",
            storageBucket: "smart-attendance-tracker-5573b.firebasestorage.app",
            messagingSenderId: "342955621552",
            appId: "1:342955621552:web:790e9b4fb8a4e8edec4f75",
            measurementId: "G-01LEWN7WHX"
        };

        // Initialize Firebase
        let auth, db;
        try {
            // Check if Firebase app is already initialized
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                console.log("✅ Firebase initialized successfully!");
            }
            
            auth = firebase.auth();
            db = firebase.firestore();
            
            // Update connection status
            document.getElementById('connectionStatus').innerHTML = "✅ Firebase connected successfully!";
            document.getElementById('connectionStatus').style.background = "#e7f5e7";
            document.getElementById('connectionStatus').style.color = "#2e7d32";
            
        } catch (error) {
            console.error("❌ Firebase initialization error:", error);
            document.getElementById('connectionStatus').innerHTML = "❌ Firebase connection failed: " + error.message;
            document.getElementById('connectionStatus').style.background = "#fee";
            document.getElementById('connectionStatus').style.color = "#c00";
        }

        // Global app data
        const appData = {
            currentUser: null,
            userRole: null
        };

        // Initialize the application
        window.onload = function() {
            setupEventListeners();
            checkAuthState();
        };

        function setupEventListeners() {
            document.getElementById('loginBtn').addEventListener('click', doLogin);
            document.getElementById('googleBtn').addEventListener('click', googleLogin);
            document.getElementById('registerBtn').addEventListener('click', showRegistration);
            document.getElementById('logoutBtn').addEventListener('click', doLogout);
            document.getElementById('testRegisterBtn').addEventListener('click', testRegistration);
            document.getElementById('testLoginBtn').addEventListener('click', testLogin);
        }

        function checkAuthState() {
            if (auth) {
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        console.log("✅ User is signed in:", user.email);
                        appData.currentUser = user;
                        showApp('teacher'); // Default role for testing
                    } else {
                        console.log("✅ User is signed out");
                        document.getElementById('loginScreen').style.display = 'block';
                        document.getElementById('appContent').style.display = 'none';
                    }
                });
            }
        }

        function testRegistration() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            const role = document.getElementById('loginRole').value;
            
            if (!auth) {
                alert("Firebase auth is not available. Please check configuration.");
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    console.log("✅ Test user created:", user.email);
                    
                    // Save user role to Firestore
                    return db.collection('users').doc(user.uid).set({
                        email: email,
                        role: role,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    alert("✅ Test registration successful! You can now login.");
                })
                .catch((error) => {
                    console.error("❌ Registration error:", error);
                    alert("Registration failed: " + error.message);
                });
        }

        function testLogin() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            if (!auth) {
                alert("Firebase auth is not available. Please check configuration.");
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    console.log("✅ Login successful:", user.email);
                    alert("✅ Login successful! Welcome " + user.email);
                    showApp('teacher');
                })
                .catch((error) => {
                    console.error("❌ Login error:", error);
                    alert("Login failed: " + error.message);
                });
        }

        function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorMsg = document.getElementById('loginError');
            
            if (!email || !password) {
                errorMsg.textContent = 'Please enter both email and password';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (!auth) {
                errorMsg.textContent = 'Firebase authentication is not available';
                errorMsg.style.display = 'block';
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    errorMsg.style.display = 'none';
                    return getUserRole(user.uid);
                })
                .then((role) => {
                    appData.userRole = role;
                    showApp(role);
                })
                .catch((error) => {
                    errorMsg.textContent = 'Login failed: ' + error.message;
                    errorMsg.style.display = 'block';
                    console.error("Login error:", error);
                });
        }

        function showRegistration() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const role = document.getElementById('loginRole').value;
            const errorMsg = document.getElementById('loginError');
            
            if (!email || !password) {
                errorMsg.textContent = 'Please enter both email and password';
                errorMsg.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorMsg.textContent = 'Password should be at least 6 characters';
                errorMsg.style.display = 'block';
                return;
            }

            if (!auth) {
                errorMsg.textContent = 'Firebase authentication is not available';
                errorMsg.style.display = 'block';
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    return db.collection('users').doc(user.uid).set({
                        email: email,
                        role: role,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    appData.userRole = role;
                    showApp(role);
                    errorMsg.style.display = 'none';
                })
                .catch((error) => {
                    errorMsg.textContent = 'Registration failed: ' + error.message;
                    errorMsg.style.display = 'block';
                });
        }

        function googleLogin() {
            if (!auth) {
                alert("Firebase auth is not available");
                return;
            }
            
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    return getUserRole(user.uid);
                })
                .then((role) => {
                    if (!role) {
                        const selectedRole = document.getElementById('loginRole').value;
                        const user = auth.currentUser;
                        return db.collection('users').doc(user.uid).set({
                            email: user.email,
                            role: selectedRole,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(() => selectedRole);
                    }
                    return role;
                })
                .then((role) => {
                    appData.userRole = role;
                    showApp(role);
                })
                .catch((error) => {
                    console.error("Google login error:", error);
                    document.getElementById('loginError').textContent = 'Google login failed: ' + error.message;
                    document.getElementById('loginError').style.display = 'block';
                });
        }

        function showApp(role) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            document.getElementById('roleBadge').textContent = role === 'principal' ? 'Principal' : 'Teacher';
            
            document.querySelectorAll('.principal-only').forEach(function(el) {
                el.style.display = role === 'principal' ? 'block' : 'none';
            });
        }

        function doLogout() {
            if (auth) {
                auth.signOut().then(() => {
                    appData.currentUser = null;
                    appData.userRole = null;
                    document.getElementById('loginScreen').style.display = 'block';
                    document.getElementById('appContent').style.display = 'none';
                });
            }
        }

        async function getUserRole(uid) {
            try {
                const doc = await db.collection('users').doc(uid).get();
                return doc.exists ? doc.data().role : 'teacher';
            } catch (error) {
                console.error("Error getting user role:", error);
                return 'teacher';
            }
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
        }
    </script>
</body>
</html>
